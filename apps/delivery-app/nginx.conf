server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Gzip for JS/CSS — browsers require correct content-encoding
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # Health check — instant 200, no disk I/O
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Vite hashed assets — cache 1 year, serve directly (404 if missing)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # SPA catch-all — no-cache on index.html so deploys are picked up immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
