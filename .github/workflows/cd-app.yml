name: "CD: Application Deployment & Verification"

on:
  workflow_run:
    workflows: ["CI: Build, Test & Containerize"]
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy_and_verify:
    name: Deploy to EC2 Host & Verify Subdomains
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy updated containers on EC2 via SSM
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          if [ -z "$INSTANCE_ID" ]; then
            echo "⚠️ EC2_INSTANCE_ID secret not set — skipping EC2 deploy step"
            exit 0
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"cd /home/ec2-user/app/sunotal_fullstk\",
              \"git pull origin main\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}\",
              \"docker compose pull\",
              \"docker compose up -d --remove-orphans\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "📡 SSM Command ID: $COMMAND_ID"

          MAX_WAIT=300
          ELAPSED=0
          INTERVAL=15

          echo "⏳ Waiting for SSM deployment to complete (up to ${MAX_WAIT}s)..."
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "  [${ELAPSED}s] Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "✅ EC2 deployment completed successfully"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "❌ EC2 deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
              InProgress|Pending|Delayed)
                ;;
              *)
                echo "  Unknown status '$STATUS' — continuing polling"
                ;;
            esac
          done

      - name: Verify Live Endpoints & Subdomains
        run: |
          echo "🌐 Verifying live domain health & asset responses..."
          DOMAINS=(
            "https://sunotal.automateuniverse.space"
            "https://admin-sunotal.automateuniverse.space"
            "https://vendor-sunotal.automateuniverse.space"
            "https://delivery-sunotal.automateuniverse.space"
            "https://support-sunotal.automateuniverse.space"
          )

          for domain in "${DOMAINS[@]}"; do
            echo "🔍 Testing $domain..."
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "$domain" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "  ✅ $domain reachable (HTTP $STATUS)"
            else
              echo "  ⚠️ $domain returned HTTP $STATUS (may take a moment for DNS/SSL)"
            fi
          done
