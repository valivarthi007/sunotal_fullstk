name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4

jobs:
  deploy:
    name: Build, Push & Deploy to ECS Fargate
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../backend && pnpm install --frozen-lockfile

      - name: Build applications
        run: |
          cd frontend && pnpm build
          cd ../backend && pnpm build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push ECR images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build and tag both SHA and latest
          docker build -t $ECR_REGISTRY/sunotal-frontend:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-frontend:latest ./frontend
          docker build -t $ECR_REGISTRY/sunotal-auth:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-auth:latest ./backend/services/auth-service
          docker build -t $ECR_REGISTRY/sunotal-operations:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-operations:latest ./backend/services/operations-service
          docker build -t $ECR_REGISTRY/sunotal-inventory:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-inventory:latest ./backend/services/inventory-service
          docker build -t $ECR_REGISTRY/sunotal-user:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-user:latest ./backend/services/user-service
          
          # Push both SHA and latest
          docker push $ECR_REGISTRY/sunotal-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-frontend:latest
          
          docker push $ECR_REGISTRY/sunotal-auth:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-auth:latest
          
          docker push $ECR_REGISTRY/sunotal-operations:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-operations:latest
          
          docker push $ECR_REGISTRY/sunotal-inventory:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-inventory:latest
          
          docker push $ECR_REGISTRY/sunotal-user:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-user:latest

      - name: Deploy to ECS Fargate
        run: |
          echo "Updating ECS Services to pull latest images..."
          aws ecs update-service --cluster sunotal-cluster --service sunotal-frontend --force-new-deployment
          aws ecs update-service --cluster sunotal-cluster --service sunotal-auth --force-new-deployment
          aws ecs update-service --cluster sunotal-cluster --service sunotal-operations --force-new-deployment
          aws ecs update-service --cluster sunotal-cluster --service sunotal-inventory --force-new-deployment
          aws ecs update-service --cluster sunotal-cluster --service sunotal-user --force-new-deployment

      - name: Run Database Migrations & Seeds on ECS Fargate
        run: |
          # Fetch Subnet and Security Group for running task
          SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=sunotal-vpc-private-1" --query "Subnets[0].SubnetId" --output text)
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=sunotal-ecs-sg" --query "SecurityGroups[0].GroupId" --output text)
          
          if [ -n "$SUBNET_ID" ] && [ "$SUBNET_ID" != "None" ] && [ -n "$SECURITY_GROUP_ID" ] && [ "$SECURITY_GROUP_ID" != "None" ]; then
            echo "Running one-off task for DB Push..."
            aws ecs run-task \
              --cluster sunotal-cluster \
              --task-definition sunotal-auth \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=ENABLED}" \
              --overrides '{"containerOverrides": [{"name": "auth", "command": ["pnpm", "run", "db:push"]}]}'
            
            echo "Running one-off task for DB Seed..."
            aws ecs run-task \
              --cluster sunotal-cluster \
              --task-definition sunotal-auth \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=ENABLED}" \
              --overrides '{"containerOverrides": [{"name": "auth", "command": ["pnpm", "run", "db:seed"]}]}'
          else
            echo "Warning: Could not fetch Subnet ID or Security Group ID for running DB migration task."
          fi

      - name: HTTP Health Check via ALB
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "sunotal-alb" --query "LoadBalancers[0].DNSName" --output text)
          if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ]; then
            echo "Running health check against ALB at http://$ALB_DNS..."
            curl --fail --retry 5 --retry-delay 5 http://$ALB_DNS/ || echo "Health check ping complete"
          fi
