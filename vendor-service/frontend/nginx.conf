upstream gateway_backend {
    server sunotal-gateway-service.sunotal.local:5000 max_fails=2 fail_timeout=5s;
    server gateway-service:5000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;

    # Gzip for JS/CSS — browsers require correct content-encoding
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # Health check — instant 200, no disk I/O
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Proxy all API calls to API Gateway service (Docker & AWS CloudMap ECS)
    location /api/ {
        proxy_pass http://gateway_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # SSE support (real-time streams)
        proxy_buffering off;
        proxy_cache off;
    }

    # Never cache index.html so new deployments load immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Vite hashed JS assets — enforce correct JavaScript MIME type
    location ~* \.(js|mjs)$ {
        include /etc/nginx/mime.types;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vite hashed CSS assets
    location ~* \.css$ {
        include /etc/nginx/mime.types;
        default_type text/css;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA catch-all — no-cache on index.html so deploys are picked up immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
