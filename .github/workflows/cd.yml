name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4
  
  # Database Configuration (Overrides via GitHub Secrets)
  DB_IDENTIFIER: ${{ secrets.DB_IDENTIFIER || 'sunotal-postgres' }}
  DB_USER: ${{ secrets.DB_USER || 'sunotal' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'sunotalpass123' }}
  DB_NAME: ${{ secrets.DB_NAME || 'sunotal' }}

jobs:
  deploy:
    name: Package, Version, Upload & Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../backend && pnpm install --frozen-lockfile

      - name: Build applications
        run: |
          cd frontend && pnpm build
          cd ../backend && pnpm build

      - name: Package artifacts
        run: |
          mkdir -p dist/artifacts
          tar -czf dist/artifacts/frontend-build.tgz -C frontend/dist .
          tar --exclude='node_modules' -czf dist/artifacts/backend-build.tgz -C backend .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Upload Versioned Artifacts to S3
        run: |
          BUILD_TAG="${GITHUB_SHA::8}"
          BUCKET_NAME="${{ env.S3_BUCKET_NAME }}"
          
          echo "Uploading build artifacts for commit ${BUILD_TAG} to s3://${BUCKET_NAME}/artifacts/..."
          
          # Upload commit-versioned artifacts
          aws s3 cp dist/artifacts/frontend-build.tgz s3://${BUCKET_NAME}/artifacts/${BUILD_TAG}/frontend-build.tgz
          aws s3 cp dist/artifacts/backend-build.tgz s3://${BUCKET_NAME}/artifacts/${BUILD_TAG}/backend-build.tgz
          aws s3 cp docker-compose.yml s3://${BUCKET_NAME}/artifacts/${BUILD_TAG}/docker-compose.yml
          
          # Upload 'latest' pointer for deployment
          aws s3 cp dist/artifacts/frontend-build.tgz s3://${BUCKET_NAME}/artifacts/latest/frontend-build.tgz
          aws s3 cp dist/artifacts/backend-build.tgz s3://${BUCKET_NAME}/artifacts/latest/backend-build.tgz
          aws s3 cp docker-compose.yml s3://${BUCKET_NAME}/artifacts/latest/docker-compose.yml

      - name: Deploy to Private EC2 via SSH through Bastion Host
        env:
          RAW_PEM_KEY: "${{ secrets.EC2_SSH_KEY }}"
        run: |
          mkdir -p ~/.ssh
          echo "$RAW_PEM_KEY" > ~/.ssh/id_rsa
          tr -d '\r' < ~/.ssh/id_rsa > ~/.ssh/id_rsa.clean
          mv ~/.ssh/id_rsa.clean ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          BASTION_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sunotal-bastion" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          PRIVATE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sunotal-frontend" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)

          DB_IDENTIFIER="${{ env.DB_IDENTIFIER }}"
          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_IDENTIFIER" \
            --query "DBInstances[0].Endpoint.Address" --output text || echo "")

          BUCKET_NAME="${{ env.S3_BUCKET_NAME }}"

          CLOUDFRONT_DOMAIN=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='CloudFront CDN for Sunotal S3 Product Assets'].DomainName" \
            --output text || echo "")

          if [ -z "$BASTION_IP" ] || [ "$BASTION_IP" = "None" ]; then
            echo "::error::Failed to find running Bastion host with tag Name=sunotal-bastion."
            exit 1
          fi

          if [ -z "$PRIVATE_IP" ] || [ "$PRIVATE_IP" = "None" ]; then
            echo "::error::Failed to find running Private EC2 instance with tag Name=sunotal-frontend."
            exit 1
          fi

          echo "Bastion Host Public IP : $BASTION_IP"
          echo "Private App EC2 IP     : $PRIVATE_IP"
          echo "RDS Database Host      : $DB_HOST"
          echo "CloudFront Domain Name : $CLOUDFRONT_DOMAIN"

          # Configure SSH Config for jump host (bastion)
          cat <<EOF > ~/.ssh/config
          Host bastion
            HostName ${BASTION_IP}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host app-private
            HostName ${PRIVATE_IP}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          echo "Testing SSH connectivity to Private EC2 via Bastion Host..."
          for i in {1..30}; do
            if ssh app-private "echo SSH connection test successful" 2>/dev/null; then
              echo "✅ SSH connection to Private EC2 established!"
              break
            fi
            echo "Attempt $i/30: SSH connection pending. Waiting 5s..."
            sleep 5
          done

          echo "Executing deployment on Private EC2 instance over SSH..."
          ssh app-private bash -s <<REMOTE_SCRIPT
            set -e
            export PATH=\$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin:~/.local/share/pnpm
            export NODE_OPTIONS='--max-old-space-size=2048'

            echo "Ensuring 2GB swap file exists on EC2 instance..."
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi

            echo "Downloading build artifacts directly from S3..."
            mkdir -p /tmp/sunotal-artifacts
            aws s3 cp s3://${BUCKET_NAME}/artifacts/latest/frontend-build.tgz /tmp/sunotal-artifacts/frontend-build.tgz
            aws s3 cp s3://${BUCKET_NAME}/artifacts/latest/backend-build.tgz /tmp/sunotal-artifacts/backend-build.tgz

            echo "Extracting frontend build to /var/www/sunotal/..."
            sudo mkdir -p /var/www/sunotal && sudo rm -rf /var/www/sunotal/*
            sudo tar -xzf /tmp/sunotal-artifacts/frontend-build.tgz -C /var/www/sunotal/

            echo "Extracting backend build to /var/www/sunotal-backend/..."
            sudo mkdir -p /var/www/sunotal-backend && sudo rm -rf /var/www/sunotal-backend/*
            sudo tar -xzf /tmp/sunotal-artifacts/backend-build.tgz -C /var/www/sunotal-backend/
            sudo chown -R ubuntu:www-data /var/www/sunotal /var/www/sunotal-backend

            cd /var/www/sunotal-backend
            if [ -n "${DB_HOST}" ] && [ "${DB_HOST}" != "None" ]; then
              echo "DATABASE_URL=postgresql://${{ env.DB_USER }}:${{ env.DB_PASSWORD }}@${DB_HOST}:5432/${{ env.DB_NAME }}?sslmode=require&uselibpqcompat=true" > .env
              if [ -n "${CLOUDFRONT_DOMAIN}" ] && [ "${CLOUDFRONT_DOMAIN}" != "None" ]; then
                echo "CLOUDFRONT_DOMAIN=https://${CLOUDFRONT_DOMAIN}" >> .env
              fi
            else
              cp -n .env.example .env || true
              if [ -n "${CLOUDFRONT_DOMAIN}" ] && [ "${CLOUDFRONT_DOMAIN}" != "None" ]; then
                echo "CLOUDFRONT_DOMAIN=https://${CLOUDFRONT_DOMAIN}" >> .env
              fi
            fi

            echo "Installing backend node modules..."
            command -v pnpm >/dev/null 2>&1 && pnpm install || npx --yes pnpm@${PNPM_VERSION} install

            echo "Pushing database schema..."
            command -v pnpm >/dev/null 2>&1 && pnpm run db:push || npx --yes pnpm@${PNPM_VERSION} run db:push

            echo "Seeding database..."
            (command -v pnpm >/dev/null 2>&1 && pnpm run db:seed || npx --yes pnpm@${PNPM_VERSION} run db:seed || true)

            echo "Starting / Restarting backend service with PM2..."
            (pm2 restart sunotal-backend --update-env || pm2 start dist/src/index.js --name sunotal-backend)
            sudo env PATH=\$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu || true
            pm2 save || true

            echo "Restarting NGINX..."
            sudo systemctl enable nginx && sudo systemctl restart nginx
            rm -rf /tmp/sunotal-artifacts
            echo "✅ Deployment completed successfully on Private EC2!"
          REMOTE_SCRIPT

      - name: HTTP Health Check via ALB
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "sunotal-alb" --query "LoadBalancers[0].DNSName" --output text)
          if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ]; then
            echo "Running health check against ALB at http://$ALB_DNS..."
            curl --fail --retry 5 --retry-delay 5 http://$ALB_DNS/ || echo "Health check ping complete"
          fi
