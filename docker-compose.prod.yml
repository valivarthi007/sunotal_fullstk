version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: sunotal-redis
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./services/unified-backend
      dockerfile: Dockerfile
    image: ${ECR_REGISTRY:-sunotal}/sunotal-backend:${IMAGE_TAG:-latest}
    container_name: sunotal-backend
    restart: always
    network_mode: "host"
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://127.0.0.1:27017/sunotal
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-sunotal-secret-jwt-key}
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: ./apps/unified-frontend/Dockerfile
    image: ${ECR_REGISTRY:-sunotal}/sunotal-frontend:${IMAGE_TAG:-latest}
    container_name: sunotal-frontend
    restart: always
    network_mode: "host"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  redis-data:
