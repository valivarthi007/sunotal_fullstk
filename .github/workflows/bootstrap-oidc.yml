name: Bootstrap GitHub OIDC Role

on:
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.6'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init & Apply
        working-directory: terraform
        id: tf_apply
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Read OIDC role ARN
        id: get_role
        working-directory: terraform
        run: |
          ROLE_ARN=$(terraform output -raw github_oidc_role_arn || true)
          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT

      - name: Save role ARN as artifact
        if: steps.get_role.outputs.role_arn != ''
        run: |
          echo "${{ steps.get_role.outputs.role_arn }}" > oidc_role_arn.txt
        shell: bash

      - name: Upload role ARN artifact
        if: steps.get_role.outputs.role_arn != ''
        uses: actions/upload-artifact@v4
        with:
          name: oidc-role-arn
          path: oidc_role_arn.txt

      - name: Create Repo Secret AWS_OIDC_ROLE_ARN (optional)
        if: secrets.ADMIN_GITHUB_TOKEN != '' && steps.get_role.outputs.role_arn != ''
        uses: peter-evans/create-or-update-secret@v4
        with:
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          secret-name: AWS_OIDC_ROLE_ARN
          secret-value: ${{ steps.get_role.outputs.role_arn }}

      - name: Log post-apply info
        run: |
          echo "Terraform apply completed. OIDC role ARN: '${{ steps.get_role.outputs.role_arn }}'"
