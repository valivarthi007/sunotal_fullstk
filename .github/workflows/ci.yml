name: "CI: Parallel Build & Containerize"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  # ─── Matrix Parallel Compilation & Type-Check ─────────────────────────────
  parallel_ci_build:
    name: Build & Type-Check (${{ matrix.service_path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service_path:
          - 'services/api-gateway'
          - 'services/auth-service'
          - 'services/catalog-service'
          - 'services/delivery-service'
          - 'services/inventory-service'
          - 'services/notification-service'
          - 'services/operations-service'
          - 'services/order-service'
          - 'services/support-service'
          - 'services/user-service'
          - 'services/vendor-service'
          - 'apps/admin-app'
          - 'apps/delivery-app'
          - 'apps/monitoring-app'
          - 'apps/support-app'
          - 'apps/user-app'
          - 'apps/vendor-app'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service_path }}
          pnpm install --no-frozen-lockfile || npm install

      - name: TypeScript Type Check
        run: |
          cd ${{ matrix.service_path }}
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          fi

      - name: Build Target Artifacts
        run: |
          cd ${{ matrix.service_path }}
          npm run build || pnpm build

  # ─── Matrix Parallel Container Build & ECR Push ───────────────────────────
  parallel_ecr_push:
    name: Docker Build & Push (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [parallel_ci_build]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target:
          - 'services/api-gateway'
          - 'services/auth-service'
          - 'services/catalog-service'
          - 'services/delivery-service'
          - 'services/inventory-service'
          - 'services/notification-service'
          - 'services/operations-service'
          - 'services/order-service'
          - 'services/support-service'
          - 'services/user-service'
          - 'services/vendor-service'
          - 'apps/admin-app'
          - 'apps/delivery-app'
          - 'apps/monitoring-app'
          - 'apps/support-app'
          - 'apps/user-app'
          - 'apps/vendor-app'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          if [ -n "$ACCOUNT_ID" ]; then
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                "$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
            echo "registry=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Container Image
        run: |
          TARGET_NAME=$(basename "${{ matrix.target }}")
          REPO_NAME="sunotal-${TARGET_NAME}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          GIT_SHA="${{ github.sha }}"

          echo "📦 Building container for ${REPO_NAME}..."
          docker build -t "${REPO_NAME}:latest" -t "${REPO_NAME}:${GIT_SHA}" "${{ matrix.target }}"

          if [ -n "$REGISTRY" ]; then
            aws ecr create-repository --repository-name "$REPO_NAME" 2>/dev/null || true
            docker tag "${REPO_NAME}:latest" "${REGISTRY}/${REPO_NAME}:latest"
            docker tag "${REPO_NAME}:${GIT_SHA}" "${REGISTRY}/${REPO_NAME}:${GIT_SHA}"
            docker push "${REGISTRY}/${REPO_NAME}:latest"
            docker push "${REGISTRY}/${REPO_NAME}:${GIT_SHA}"
            echo "🚀 Pushed ${REPO_NAME} to ECR"
          fi
