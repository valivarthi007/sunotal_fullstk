apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sunotal-frontend-hpa
  namespace: sunotal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sunotal-frontend
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sunotal-delivery-hpa
  namespace: sunotal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sunotal-delivery
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
