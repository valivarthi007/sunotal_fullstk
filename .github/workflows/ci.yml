name: "CI: Parallel Build & Containerize"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  # ─── Matrix Parallel Compilation via Ansible ──────────────────────────────
  parallel_ci_build:
    name: Build & Type-Check via Ansible (${{ matrix.service_path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service_path:
          - 'services/api-gateway'
          - 'services/auth-service'
          - 'services/catalog-service'
          - 'services/delivery-service'
          - 'services/inventory-service'
          - 'services/notification-service'
          - 'services/operations-service'
          - 'services/order-service'
          - 'services/support-service'
          - 'services/user-service'
          - 'services/vendor-service'
          - 'apps/admin-app'
          - 'apps/delivery-app'
          - 'apps/monitoring-app'
          - 'apps/support-app'
          - 'apps/user-app'
          - 'apps/vendor-app'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Ansible
        run: pip install ansible

      - name: Run Ansible Target Compilation Playbook
        run: ansible-playbook ansible/ci_build_single_target.yml -e "target_path=${{ matrix.service_path }}"

  # ─── Matrix Parallel Container Build & ECR Push via Ansible ─────────────────
  parallel_ecr_push:
    name: Docker Build & Push via Ansible (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [parallel_ci_build]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target:
          - 'services/api-gateway'
          - 'services/auth-service'
          - 'services/catalog-service'
          - 'services/delivery-service'
          - 'services/inventory-service'
          - 'services/notification-service'
          - 'services/operations-service'
          - 'services/order-service'
          - 'services/support-service'
          - 'services/user-service'
          - 'services/vendor-service'
          - 'apps/admin-app'
          - 'apps/delivery-app'
          - 'apps/monitoring-app'
          - 'apps/support-app'
          - 'apps/user-app'
          - 'apps/vendor-app'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Ansible
        run: pip install ansible

      - name: Run Ansible ECR Container Build & Push Playbook
        run: ansible-playbook ansible/build_and_push_single_target.yml -e "target_path=${{ matrix.target }}"
        env:
          GITHUB_SHA: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
