name: Infrastructure Teardown

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm teardown of infrastructure'
        required: true
        default: ''

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  destroy_infrastructure:
    name: Destroy Infrastructure with Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error::Confirmation failed. You must type 'DESTROY' to execute teardown."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure DynamoDB State Lock Table Exists
        run: |
          aws dynamodb create-table \
            --table-name sunotal-terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region "${{ env.AWS_REGION }}" || true
          aws dynamodb wait table-exists --table-name sunotal-terraform-locks --region "${{ env.AWS_REGION }}" || true

      - name: Restore Non-Empty State File from S3 Version History
        run: |
          BUCKET_NAME="jcs-raju-sunotal-final"
          KEY="state/terraform.tfstate"
          echo "Inspecting S3 remote state file at s3://${BUCKET_NAME}/${KEY}..."

          aws s3 cp "s3://${BUCKET_NAME}/${KEY}" /tmp/current-state.json 2>/dev/null || echo "{}" > /tmp/current-state.json

          if ! grep -q '"type": *"aws_' /tmp/current-state.json 2>/dev/null; then
            echo "Current state is empty or missing. Searching S3 version history for valid state snapshot..."
            VERSIONS=$(aws s3api list-object-versions --bucket "$BUCKET_NAME" --prefix "$KEY" --query 'Versions[*].VersionId' --output text 2>/dev/null || echo "")
            
            for VID in $VERSIONS; do
              if [ -n "$VID" ] && [ "$VID" != "None" ] && [ "$VID" != "null" ]; then
                aws s3 cp "s3://${BUCKET_NAME}/${KEY}?versionId=${VID}" /tmp/candidate-state.json 2>/dev/null || true
                if grep -q '"type": *"aws_' /tmp/candidate-state.json 2>/dev/null; then
                  echo "Found valid state snapshot versionId: $VID. Restoring state/terraform.tfstate..."
                  aws s3api copy-object \
                    --bucket "$BUCKET_NAME" \
                    --copy-source "${BUCKET_NAME}/${KEY}?versionId=${VID}" \
                    --key "$KEY"
                  echo "✅ Terraform remote state restored successfully!"
                  break
                fi
              fi
            done
          else
            echo "Current remote state file is valid."
          fi

          echo "Clearing stale state lock digest in DynamoDB..."
          aws dynamodb delete-item \
            --table-name sunotal-terraform-locks \
            --key '{"LockID": {"S": "'"${BUCKET_NAME}"'/state/terraform.tfstate-md5"}}' \
            --region "${{ env.AWS_REGION }}" || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Empty S3 Bucket Build Artifacts (Preserve State)
        run: |
          BUCKET_NAME="jcs-raju-sunotal-final"
          echo "Emptying build artifacts in s3://${BUCKET_NAME}/artifacts..."
          aws s3 rm s3://${BUCKET_NAME}/artifacts --recursive || true

      - name: Destroy Infrastructure with Terraform
        run: |
          cd terraform
          terraform init -upgrade

          echo "Syncing existing AWS resources into Terraform state before destroy..."
          STATE_LIST=$(terraform state list 2>/dev/null || echo "")

          # 1. IAM Role: sunotal-ec2-s3-access-role
          if ! echo "$STATE_LIST" | grep -q "aws_iam_role.ec2_s3_role"; then
            if aws iam get-role --role-name sunotal-ec2-s3-access-role >/dev/null 2>&1; then
              echo "Importing existing IAM Role sunotal-ec2-s3-access-role..."
              terraform import -var="ami_id=destroy-placeholder" -var="key_name=jcs_raju_laptop" aws_iam_role.ec2_s3_role sunotal-ec2-s3-access-role || true
            fi
          fi

          # 2. IAM Policy: sunotal-s3-access-policy
          if ! echo "$STATE_LIST" | grep -q "aws_iam_policy.s3_artifacts_policy"; then
            POLICY_ARN=$(aws iam list-policies --query "Policies[?PolicyName=='sunotal-s3-access-policy'].Arn" --output text 2>/dev/null || echo "")
            if [ -n "$POLICY_ARN" ] && [ "$POLICY_ARN" != "None" ]; then
              echo "Importing existing IAM Policy sunotal-s3-access-policy..."
              terraform import -var="ami_id=destroy-placeholder" -var="key_name=jcs_raju_laptop" aws_iam_policy.s3_artifacts_policy "$POLICY_ARN" || true
            fi
          fi

          # 3. IAM Instance Profile: sunotal-ec2-instance-profile
          if ! echo "$STATE_LIST" | grep -q "aws_iam_instance_profile.ec2_s3_profile"; then
            if aws iam get-instance-profile --instance-profile-name sunotal-ec2-instance-profile >/dev/null 2>&1; then
              echo "Importing existing IAM Instance Profile sunotal-ec2-instance-profile..."
              terraform import -var="ami_id=destroy-placeholder" -var="key_name=jcs_raju_laptop" aws_iam_instance_profile.ec2_s3_profile sunotal-ec2-instance-profile || true
            fi
          fi

          # 4. CloudFront OAC: sunotal-s3-oac
          if ! echo "$STATE_LIST" | grep -q "aws_cloudfront_origin_access_control.s3_oac"; then
            OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='sunotal-s3-oac'].Id" --output text 2>/dev/null || echo "")
            if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ]; then
              echo "Importing existing CloudFront OAC sunotal-s3-oac ($OAC_ID)..."
              terraform import -var="ami_id=destroy-placeholder" -var="key_name=jcs_raju_laptop" aws_cloudfront_origin_access_control.s3_oac "$OAC_ID" || true
            fi
          fi

          # 5. VPC: sunotal-vpc
          if ! echo "$STATE_LIST" | grep -q "aws_vpc.main"; then
            VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=sunotal-vpc" --query "Vpcs[0].VpcId" --output text 2>/dev/null || echo "")
            if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
              echo "Importing existing VPC sunotal-vpc ($VPC_ID)..."
              terraform import -var="ami_id=destroy-placeholder" -var="key_name=jcs_raju_laptop" aws_vpc.main "$VPC_ID" || true
            fi
          fi

          echo "Destroying managed infrastructure..."
          terraform destroy -auto-approve -var="ami_id=destroy-placeholder" -var="key_name=jcs_raju_laptop"

      - name: Deregister Packer AMIs & Delete EBS Snapshots
        run: |
          echo "Searching for AMIs tagged Project=sunotal or Name=sunotal-frontend-ami..."
          
          AMI_IDS=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=tag:Project,Values=sunotal" \
            --query 'Images[*].ImageId' \
            --output text)
          
          if [ -z "$AMI_IDS" ] || [ "$AMI_IDS" = "None" ]; then
            echo "No tagged AMIs found to deregister."
          else
            for AMI_ID in $AMI_IDS; do
              echo "Processing AMI: $AMI_ID"
              
              SNAPSHOT_IDS=$(aws ec2 describe-images \
                --image-ids "$AMI_ID" \
                --query 'Images[0].BlockDeviceMappings[*].Ebs.SnapshotId' \
                --output text)
              
              echo "Deregistering AMI: $AMI_ID..."
              aws ec2 deregister-image --image-id "$AMI_ID"
              
              for SNAP_ID in $SNAPSHOT_IDS; do
                if [ "$SNAP_ID" != "None" ] && [ -n "$SNAP_ID" ]; then
                  echo "Deleting associated EBS snapshot: $SNAP_ID..."
                  aws ec2 delete-snapshot --snapshot-id "$SNAP_ID" || true
                fi
              done
            done
            echo "All Packer AMI resources deregistered and snapshots purged successfully!"
          fi

      - name: Purge Remaining Orphaned Resources (Full AWS us-east-1 Sweeper)
        run: |
          echo "Sweeping & Purging all remaining resources tagged Project=sunotal or named sunotal-* in us-east-1..."

          # 1. Terminate lingering EC2 Instances
          INST_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=sunotal" "Name=instance-state-name,Values=running,pending,stopped" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text 2>/dev/null || echo "")
          if [ -n "$INST_IDS" ] && [ "$INST_IDS" != "None" ]; then
            echo "Terminating lingering instances: $INST_IDS"
            aws ec2 terminate-instances --instance-ids $INST_IDS || true
          fi

          # 2. Delete RDS Instance (if exists)
          if aws rds describe-db-instances --db-instance-identifier "sunotal-postgres" >/dev/null 2>&1; then
            echo "Deleting RDS DB Instance sunotal-postgres..."
            aws rds delete-db-instance --db-instance-identifier "sunotal-postgres" --skip-final-snapshot --delete-automated-backups || true
          fi

          # 3. Delete Load Balancer
          ALB_ARN=$(aws elbv2 describe-load-balancers --names "sunotal-alb" --query "LoadBalancers[0].LoadBalancerArn" --output text 2>/dev/null || echo "")
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            echo "Deleting ALB sunotal-alb ($ALB_ARN)..."
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" || true
          fi

          # 4. Delete Target Group
          TG_ARN=$(aws elbv2 describe-target-groups --names "sunotal-app-tg" --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")
          if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            echo "Deleting Target Group sunotal-app-tg ($TG_ARN)..."
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN" || true
          fi

          # 5. Delete CloudFront Origin Access Control
          OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='sunotal-s3-oac'].Id" --output text 2>/dev/null || echo "")
          if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ]; then
            OAC_ETAG=$(aws cloudfront get-origin-access-control --id "$OAC_ID" --query "ETag" --output text 2>/dev/null || echo "")
            echo "Deleting CloudFront OAC sunotal-s3-oac ($OAC_ID)..."
            aws cloudfront delete-origin-access-control --id "$OAC_ID" --if-match "$OAC_ETAG" || true
          fi

          # 6. Delete IAM Role & Instance Profile & Policy
          if aws iam get-instance-profile --instance-profile-name "sunotal-ec2-instance-profile" >/dev/null 2>&1; then
            echo "Deleting IAM Instance Profile sunotal-ec2-instance-profile..."
            aws iam remove-role-from-instance-profile --instance-profile-name "sunotal-ec2-instance-profile" --role-name "sunotal-ec2-s3-access-role" 2>/dev/null || true
            aws iam delete-instance-profile --instance-profile-name "sunotal-ec2-instance-profile" || true
          fi

          POLICY_ARN=$(aws iam list-policies --query "Policies[?PolicyName=='sunotal-s3-access-policy'].Arn" --output text 2>/dev/null || echo "")
          if [ -n "$POLICY_ARN" ] && [ "$POLICY_ARN" != "None" ]; then
            echo "Detaching & Deleting IAM Policy sunotal-s3-access-policy..."
            aws iam detach-role-policy --role-name "sunotal-ec2-s3-access-role" --policy-arn "$POLICY_ARN" 2>/dev/null || true
            aws iam delete-policy --policy-arn "$POLICY_ARN" || true
          fi

          if aws iam get-role --role-name "sunotal-ec2-s3-access-role" >/dev/null 2>&1; then
            echo "Deleting IAM Role sunotal-ec2-s3-access-role..."
            aws iam delete-role --role-name "sunotal-ec2-s3-access-role" || true
          fi

          # 7. Delete VPC & Subnets (if exists)
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=sunotal-vpc" --query "Vpcs[0].VpcId" --output text 2>/dev/null || echo "")
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Deleting VPC sunotal-vpc ($VPC_ID) subnets & resources..."
            SG_IDS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" --query "SecurityGroups[?GroupName!='default'].GroupId" --output text 2>/dev/null || echo "")
            for SG in $SG_IDS; do
              aws ec2 delete-security-group --group-id "$SG" || true
            done
            aws ec2 delete-vpc --vpc-id "$VPC_ID" || true
          fi

          echo "🎉 Complete Clean Sweep Finished! Every sunotal resource in us-east-1 wiped."
