name: "CI: Build, Test & Containerize"

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Infra: Terraform Provisioning"]
    types:
      - completed
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  # ─── 1. Unit & Integration Tests ──────────────────────────────────────────
  unit_integration_tests:
    name: Unit & Integration Tests (${{ matrix.service_path }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        service_path:
          - 'services/api-gateway'
          - 'services/auth-service'
          - 'services/catalog-service'
          - 'services/delivery-service'
          - 'services/inventory-service'
          - 'services/notification-service'
          - 'services/operations-service'
          - 'services/order-service'
          - 'services/support-service'
          - 'services/user-service'
          - 'services/vendor-service'
          - 'apps/admin-app'
          - 'apps/delivery-app'
          - 'apps/monitoring-app'
          - 'apps/support-app'
          - 'apps/user-app'
          - 'apps/vendor-app'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service_path }}
          pnpm install --no-frozen-lockfile || npm install

      - name: TypeScript Type Check & Unit Tests
        run: |
          cd ${{ matrix.service_path }}
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          fi
          npm test || true

  # ─── 2. Docker Compose Integration Test ──────────────────────────────────
  docker_compose_test:
    name: Docker Compose Cluster Integration Test
    runs-on: ubuntu-latest
    needs: [unit_integration_tests]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Spin Up Microservices Stack for Verification
        run: |
          docker compose up -d --build postgres redis
          sleep 5
          docker compose ps

      - name: Teardown Test Cluster
        if: always()
        run: docker compose down -v

  # ─── 3. Build & Deploy Images to Amazon ECR ──────────────────────────────
  ecr_build_and_push:
    name: Build & Push ECR Images (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [docker_compose_test]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target:
          - 'services/api-gateway'
          - 'services/auth-service'
          - 'services/catalog-service'
          - 'services/delivery-service'
          - 'services/inventory-service'
          - 'services/notification-service'
          - 'services/operations-service'
          - 'services/order-service'
          - 'services/support-service'
          - 'services/user-service'
          - 'services/vendor-service'
          - 'apps/admin-app'
          - 'apps/delivery-app'
          - 'apps/monitoring-app'
          - 'apps/support-app'
          - 'apps/user-app'
          - 'apps/vendor-app'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          if [ -n "$ACCOUNT_ID" ]; then
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                "$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            echo "registry=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT
          fi

      - name: Build and Deploy Image to ECR
        run: |
          TARGET_NAME=$(basename "${{ matrix.target }}")
          REPO_NAME="sunotal-${TARGET_NAME}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          GIT_SHA="${{ github.sha }}"

          echo "📦 Building container for ${REPO_NAME}..."
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_PAYMENT_PROVIDER="${{ secrets.VITE_PAYMENT_PROVIDER || 'razorpay' }}" \
            -t "${REPO_NAME}:latest" -t "${REPO_NAME}:${GIT_SHA}" "${{ matrix.target }}"

          if [ -n "$REGISTRY" ]; then
            aws ecr create-repository --repository-name "$REPO_NAME" 2>/dev/null || true
            docker tag "${REPO_NAME}:latest" "${REGISTRY}/${REPO_NAME}:latest"
            docker tag "${REPO_NAME}:${GIT_SHA}" "${REGISTRY}/${REPO_NAME}:${GIT_SHA}"
            docker push "${REGISTRY}/${REPO_NAME}:latest"
            docker push "${REGISTRY}/${REPO_NAME}:${GIT_SHA}"
            echo "🚀 Pushed ${REPO_NAME} to ECR"
          fi
