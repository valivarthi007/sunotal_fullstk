version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Building Sunotal Unified Quick-Commerce Application..."
        - cd apps/user-app
        - npm install --include=dev
        - npm run build
  artifacts:
    baseDirectory: apps/user-app/dist
    files:
      - '**/*'
  cache:
    paths:
      - apps/user-app/node_modules/**/*
