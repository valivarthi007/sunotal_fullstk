name: "CI: Build, Test & Containerize"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  # ─── 1. Parallel TypeScript Type Check & Build Verification ─────────────────
  build_and_typecheck:
    name: Type Check & Build (${{ matrix.service_path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service_path:
          - 'gateway-service'
          - 'public-service/backend'
          - 'public-service/frontend'
          - 'admin-service/backend'
          - 'admin-service/frontend'
          - 'vendor-service/backend'
          - 'vendor-service/frontend'
          - 'delivery-service/backend'
          - 'delivery-service/frontend'
          - 'support-monitoring-service/backend'
          - 'support-monitoring-service/frontend/support-app'
          - 'support-monitoring-service/frontend/monitoring-app'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service_path }}/package.json'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service_path }}
          npm install --legacy-peer-deps --no-package-lock

      - name: TypeScript Typecheck & Build
        run: |
          cd ${{ matrix.service_path }}
          if grep -q '"build":' package.json; then
            npm run build
          else
            npx tsc --noEmit
          fi

  # ─── 2. Docker Compose Configuration Validation ─────────────────────────────
  docker_compose_test:
    name: Docker Compose Integration Validation
    runs-on: ubuntu-latest
    needs: [build_and_typecheck]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Spin Up Infrastructure Containers (DB + Redis)
        run: |
          docker compose up -d postgres redis
          sleep 5
          docker compose exec -T postgres pg_isready -U sunotal

      - name: Verify Seed Admin User Credentials
        run: |
          export DATABASE_URL="postgresql://sunotal:sunotal_pass_dev@127.0.0.1:5432/sunotal"
          npm install pg bcryptjs
          node scripts/seed-admin-users.js

      - name: Teardown Test Infrastructure
        if: always()
        run: docker compose down -v

  # ─── 3. Build & Push ECR Container Images ────────────────────────────────────
  ecr_build_and_push:
    name: Build & Push ECR (${{ matrix.repo }})
    runs-on: ubuntu-latest
    needs: [docker_compose_test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'gateway-service'
            repo: 'sunotal-gateway-service'
          - target: 'public-service/backend'
            repo: 'sunotal-public-backend'
          - target: 'public-service/frontend'
            repo: 'sunotal-public-frontend'
          - target: 'admin-service/backend'
            repo: 'sunotal-admin-backend'
          - target: 'admin-service/frontend'
            repo: 'sunotal-admin-frontend'
          - target: 'vendor-service/backend'
            repo: 'sunotal-vendor-backend'
          - target: 'vendor-service/frontend'
            repo: 'sunotal-vendor-frontend'
          - target: 'delivery-service/backend'
            repo: 'sunotal-delivery-backend'
          - target: 'delivery-service/frontend'
            repo: 'sunotal-delivery-frontend'
          - target: 'support-monitoring-service/backend'
            repo: 'sunotal-support-monitoring-backend'
          - target: 'support-monitoring-service/frontend/support-app'
            repo: 'sunotal-support-frontend'
          - target: 'support-monitoring-service/frontend/monitoring-app'
            repo: 'sunotal-monitoring-frontend'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.target }}
          file: ./${{ matrix.target }}/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
