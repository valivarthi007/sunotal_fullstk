version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Building Sunotal Unified Quick-Commerce Application..."
        - cd apps/user-app
        - npm install --include=dev
        - npm run build
  artifacts:
    baseDirectory: apps/user-app/dist
    files:
      - '**/*'
  cache:
    paths:
      - apps/user-app/node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: 'index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
