#cloud-config
package_update: true
package_upgrade: true
packages:
  - git
  - htop
  - jq
  - docker
  - python3
  - python3-pip

write_files:
  - path: /etc/environment
    content: |
      JWT_SECRET="${jwt_secret}"
      MONGODB_URI="${mongodb_uri}"
      AWS_REGION="${aws_region}"
      S3_BUCKET="${s3_bucket}"
      FRONTEND_ORIGIN="${frontend_origin}"
      NODE_ENV="production"
    permissions: '0644'

  - path: /home/ec2-user/run_ansible.yml
    content: |
      ---
      - hosts: localhost
        connection: local
        become: true
        tasks:
          - name: Ensure docker service is running
            systemd:
              name: docker
              state: started
              enabled: true

          - name: Add ec2-user to docker group
            user:
              name: ec2-user
              groups: docker
              append: true

          - name: Clone Sunotal codebase
            git:
              repo: "${repo_url}"
              dest: /home/ec2-user/app/sunotal_fullstk
              version: main
              force: true

          - name: Run Ansible microservices deployment playbook
            command: ansible-playbook /home/ec2-user/app/sunotal_fullstk/ansible/deploy.yml
    permissions: '0644'

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - pip3 install ansible
  - ansible-playbook /home/ec2-user/run_ansible.yml
