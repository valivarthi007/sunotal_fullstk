events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # 1. Customer Grocery Storefront (sunotal.automateuniverse.space & default)
    server {
        listen 80;
        server_name sunotal.automateuniverse.space localhost "";

        location / {
            root /usr/share/nginx/html/user-app;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }

    # 2. Farmer & Vendor Portal (vendor-sunotal.automateuniverse.space)
    server {
        listen 80;
        server_name vendor-sunotal.automateuniverse.space farmer-sunotal.automateuniverse.space;

        location / {
            root /usr/share/nginx/html/vendor-app;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
        }
    }

    # 3. Admin Control Center (admin-sunotal.automateuniverse.space)
    server {
        listen 80;
        server_name admin-sunotal.automateuniverse.space admin.automateuniverse.space;

        location / {
            root /usr/share/nginx/html/admin-app;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
        }
    }

    # 4. Delivery Partner Portal (delivery-sunotal.automateuniverse.space)
    server {
        listen 80;
        server_name delivery-sunotal.automateuniverse.space rider-sunotal.automateuniverse.space;

        location / {
            root /usr/share/nginx/html/delivery-app;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
        }
    }

    # 5. Internal Support Portal (support-sunotal.automateuniverse.space)
    server {
        listen 80;
        server_name support-sunotal.automateuniverse.space help-sunotal.automateuniverse.space;

        location / {
            root /usr/share/nginx/html/support-app;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
        }
    }
}
