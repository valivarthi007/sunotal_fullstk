repos:
  # ─── Terraform Hooks ─────────────────────────────────────────────────────────
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      # Enforce formatting — blocks commit if any .tf file is not formatted
      - id: terraform_fmt
        args:
          - --args=-recursive

      # Validate root terraform config on every commit
      - id: terraform_validate
        args:
          - --init-args=-backend=false -input=false

      # Block secrets from being committed in .tfvars files
      - id: terraform_trivy
        args:
          - --args=--severity HIGH,CRITICAL

  # ─── General File Health ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [commit]
