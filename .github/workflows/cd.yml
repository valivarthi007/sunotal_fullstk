name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target Compute Platform (auto, eks, or ecs)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - eks
          - ecs

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  deploy:
    name: Deploy Application
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
        continue-on-error: true

      - name: Auto-Detect Active Deployment Target
        id: set_target
        run: |
          TARGET="${{ inputs.deploy_target }}"
          
          if [ -z "$TARGET" ] || [ "$TARGET" = "auto" ]; then
            echo "Attempting auto-detection of active compute target from SSM..."
            TARGET=$(aws ssm get-parameter --name "/sunotal/compute_target" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          fi

          if [ -z "$TARGET" ] || [ "$TARGET" = "auto" ]; then
            echo "SSM parameter not found. Checking if EKS cluster 'sunotal-cluster' is ACTIVE..."
            EKS_STATUS=$(aws eks describe-cluster --name sunotal-cluster --query "cluster.status" --output text 2>/dev/null || echo "")
            if [ "$EKS_STATUS" = "ACTIVE" ]; then
              TARGET="eks"
            else
              TARGET="ecs"
            fi
          fi

          echo "DEPLOY_TARGET=$TARGET" >> $GITHUB_ENV
          echo "✅ Active Deployment Target set to: $TARGET"

      - name: Deploy to AWS EKS
        if: env.DEPLOY_TARGET == 'eks'
        run: |
          echo "🚀 Deploying to AWS EKS Cluster (sunotal-cluster)..."
          aws eks update-kubeconfig --name sunotal-cluster --region ${{ env.AWS_DEFAULT_REGION }} || true

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          if [ -n "$ACCOUNT_ID" ]; then
            ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
            echo "Substituting ECR registry: $ECR_REGISTRY"
            sed -i "s|sunotal-frontend:latest|${ECR_REGISTRY}/sunotal-frontend:latest|g" k8s/02-deployments.yaml
            sed -i "s|sunotal-auth:latest|${ECR_REGISTRY}/sunotal-auth:latest|g" k8s/02-deployments.yaml k8s/05-db-migration-job.yaml
            sed -i "s|sunotal-operations:latest|${ECR_REGISTRY}/sunotal-operations:latest|g" k8s/02-deployments.yaml
            sed -i "s|sunotal-inventory:latest|${ECR_REGISTRY}/sunotal-inventory:latest|g" k8s/02-deployments.yaml
            sed -i "s|sunotal-user:latest|${ECR_REGISTRY}/sunotal-user:latest|g" k8s/02-deployments.yaml
          fi

          # Dynamic RDS Host Discovery & Secret Sync
          RDS_HOST=$(aws rds describe-db-instances --db-instance-identifier sunotal-postgres --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          if [ -n "$RDS_HOST" ] && [ "$RDS_HOST" != "None" ]; then
            echo "Dynamic RDS Host discovered: $RDS_HOST"
            sed -i "s|sunotal-postgres.cs1gq0a2wtpu.us-east-1.rds.amazonaws.com|${RDS_HOST}|g" k8s/01-configmap-secret.yaml
          fi

          echo "Applying Kubernetes Namespace, ConfigMaps, and Services..."
          kubectl apply -f k8s/00-namespace.yaml || true
          kubectl apply -f k8s/01-configmap-secret.yaml || true
          kubectl apply -f k8s/03-services.yaml || true
          kubectl apply -f k8s/04-ingress.yaml || true

          echo "Running DB migrations on EKS..."
          kubectl delete job sunotal-db-migration -n sunotal --ignore-not-found || true
          kubectl apply -f k8s/05-db-migration-job.yaml || true
          kubectl wait --for=condition=complete job/sunotal-db-migration -n sunotal --timeout=120s || true

          echo "Applying Application Deployments..."
          kubectl apply -f k8s/02-deployments.yaml || true
          kubectl rollout status deployment/sunotal-frontend -n sunotal --timeout=180s || true
          kubectl rollout status deployment/sunotal-auth -n sunotal --timeout=180s || true
          kubectl rollout status deployment/sunotal-operations -n sunotal --timeout=180s || true
          kubectl rollout status deployment/sunotal-inventory -n sunotal --timeout=180s || true
          kubectl rollout status deployment/sunotal-user -n sunotal --timeout=180s || true

          echo "Configuring Security Groups and Target Groups on AWS..."
          ALB_SG=$(aws elbv2 describe-load-balancers --names "sunotal-alb" --query "LoadBalancers[0].SecurityGroups[0]" --output text 2>/dev/null || echo "")
          EKS_SG=$(aws eks describe-cluster --name sunotal-cluster --query "cluster.resourcesVpcConfig.clusterSecurityGroupId" --output text 2>/dev/null || echo "")
          
          if [ -n "$ALB_SG" ] && [ -n "$EKS_SG" ]; then
            aws ec2 authorize-security-group-ingress --group-id "$EKS_SG" --protocol -1 --source-group "$ALB_SG" 2>/dev/null || true
          fi

          echo "Dynamically resolving Target Group ARNs..."
          AUTH_TG_ARN=$(aws elbv2 describe-target-groups --names "sunotal-auth-tg" --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")
          USER_TG_ARN=$(aws elbv2 describe-target-groups --names "sunotal-user-tg" --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")
          FRONTEND_TG_ARN=$(aws elbv2 describe-target-groups --names "sunotal-frontend-tg" --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")
          OPERATIONS_TG_ARN=$(aws elbv2 describe-target-groups --names "sunotal-operations-tg" --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")
          INVENTORY_TG_ARN=$(aws elbv2 describe-target-groups --names "sunotal-inventory-tg" --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")

          echo "Updating Target Group HealthCheckPaths to /api/healthz..."
          if [ -n "$INVENTORY_TG_ARN" ]; then aws elbv2 modify-target-group --target-group-arn "$INVENTORY_TG_ARN" --health-check-path "/api/healthz" 2>/dev/null || true; fi
          if [ -n "$OPERATIONS_TG_ARN" ]; then aws elbv2 modify-target-group --target-group-arn "$OPERATIONS_TG_ARN" --health-check-path "/api/healthz" 2>/dev/null || true; fi
          if [ -n "$USER_TG_ARN" ]; then aws elbv2 modify-target-group --target-group-arn "$USER_TG_ARN" --health-check-path "/api/healthz" 2>/dev/null || true; fi

          echo "Registering active EKS Pod IPs into ALB Target Groups..."
          AUTH_IP=$(kubectl get pods -n sunotal -l app=sunotal-auth --field-selector=status.phase=Running -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || echo "")
          USER_IP=$(kubectl get pods -n sunotal -l app=sunotal-user --field-selector=status.phase=Running -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || echo "")
          FRONTEND_IP=$(kubectl get pods -n sunotal -l app=sunotal-frontend --field-selector=status.phase=Running -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || echo "")
          OPERATIONS_IP=$(kubectl get pods -n sunotal -l app=sunotal-operations --field-selector=status.phase=Running -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || echo "")
          INVENTORY_IP=$(kubectl get pods -n sunotal -l app=sunotal-inventory --field-selector=status.phase=Running -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || echo "")

          if [ -n "$AUTH_IP" ] && [ -n "$AUTH_TG_ARN" ]; then aws elbv2 register-targets --target-group-arn "$AUTH_TG_ARN" --targets Id=$AUTH_IP,Port=5001 2>/dev/null || true; fi
          if [ -n "$USER_IP" ] && [ -n "$USER_TG_ARN" ]; then aws elbv2 register-targets --target-group-arn "$USER_TG_ARN" --targets Id=$USER_IP,Port=5004 2>/dev/null || true; fi
          if [ -n "$FRONTEND_IP" ] && [ -n "$FRONTEND_TG_ARN" ]; then aws elbv2 register-targets --target-group-arn "$FRONTEND_TG_ARN" --targets Id=$FRONTEND_IP,Port=80 2>/dev/null || true; fi
          if [ -n "$OPERATIONS_IP" ] && [ -n "$OPERATIONS_TG_ARN" ]; then aws elbv2 register-targets --target-group-arn "$OPERATIONS_TG_ARN" --targets Id=$OPERATIONS_IP,Port=5002 2>/dev/null || true; fi
          if [ -n "$INVENTORY_IP" ] && [ -n "$INVENTORY_TG_ARN" ]; then aws elbv2 register-targets --target-group-arn "$INVENTORY_TG_ARN" --targets Id=$INVENTORY_IP,Port=5003 2>/dev/null || true; fi

          # Clean up stale target IP registrations
          if [ -n "$AUTH_TG_ARN" ]; then
            AUTH_REG=$(aws elbv2 describe-target-health --target-group-arn "$AUTH_TG_ARN" --query "TargetHealthDescriptions[*].Target.Id" --output text 2>/dev/null || echo "")
            for ip in $AUTH_REG; do if [ "$ip" != "$AUTH_IP" ]; then aws elbv2 deregister-targets --target-group-arn "$AUTH_TG_ARN" --targets Id=$ip,Port=5001 2>/dev/null || true; fi; done
          fi

          if [ -n "$USER_TG_ARN" ]; then
            USER_REG=$(aws elbv2 describe-target-health --target-group-arn "$USER_TG_ARN" --query "TargetHealthDescriptions[*].Target.Id" --output text 2>/dev/null || echo "")
            for ip in $USER_REG; do if [ "$ip" != "$USER_IP" ]; then aws elbv2 deregister-targets --target-group-arn "$USER_TG_ARN" --targets Id=$ip,Port=5004 2>/dev/null || true; fi; done
          fi

          if [ -n "$FRONTEND_TG_ARN" ]; then
            FRONTEND_REG=$(aws elbv2 describe-target-health --target-group-arn "$FRONTEND_TG_ARN" --query "TargetHealthDescriptions[*].Target.Id" --output text 2>/dev/null || echo "")
            for ip in $FRONTEND_REG; do if [ "$ip" != "$FRONTEND_IP" ]; then aws elbv2 deregister-targets --target-group-arn "$FRONTEND_TG_ARN" --targets Id=$ip,Port=80 2>/dev/null || true; fi; done
          fi

          if [ -n "$OPERATIONS_TG_ARN" ]; then
            OPERATIONS_REG=$(aws elbv2 describe-target-health --target-group-arn "$OPERATIONS_TG_ARN" --query "TargetHealthDescriptions[*].Target.Id" --output text 2>/dev/null || echo "")
            for ip in $OPERATIONS_REG; do if [ "$ip" != "$OPERATIONS_IP" ]; then aws elbv2 deregister-targets --target-group-arn "$OPERATIONS_TG_ARN" --targets Id=$ip,Port=5002 2>/dev/null || true; fi; done
          fi

          if [ -n "$INVENTORY_TG_ARN" ]; then
            INVENTORY_REG=$(aws elbv2 describe-target-health --target-group-arn "$INVENTORY_TG_ARN" --query "TargetHealthDescriptions[*].Target.Id" --output text 2>/dev/null || echo "")
            for ip in $INVENTORY_REG; do if [ "$ip" != "$INVENTORY_IP" ]; then aws elbv2 deregister-targets --target-group-arn "$INVENTORY_TG_ARN" --targets Id=$ip,Port=5003 2>/dev/null || true; fi; done
          fi
        continue-on-error: true

      - name: Deploy to ECS Fargate
        if: env.DEPLOY_TARGET == 'ecs'
        run: |
          echo "Updating ECS Services..."
          aws ecs update-service --cluster sunotal-cluster --service sunotal-frontend --force-new-deployment || true
          aws ecs update-service --cluster sunotal-cluster --service sunotal-auth --force-new-deployment || true
          aws ecs update-service --cluster sunotal-cluster --service sunotal-operations --force-new-deployment || true
          aws ecs update-service --cluster sunotal-cluster --service sunotal-inventory --force-new-deployment || true
          aws ecs update-service --cluster sunotal-cluster --service sunotal-user --force-new-deployment || true

          SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=sunotal-vpc-private-subnet-1" --query "Subnets[0].SubnetId" --output text 2>/dev/null || echo "")
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=sunotal-ecs-sg" --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "")
          
          if [ -n "$SUBNET_ID" ] && [ "$SUBNET_ID" != "None" ] && [ -n "$SECURITY_GROUP_ID" ] && [ "$SECURITY_GROUP_ID" != "None" ]; then
            echo "Running DB migrations on ECS..."
            aws ecs run-task \
              --cluster sunotal-cluster \
              --task-definition sunotal-auth \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=ENABLED}" \
              --overrides '{"containerOverrides": [{"name": "auth", "command": ["pnpm", "run", "db:push"]}]}' || true
          fi

          aws ecs wait services-stable --cluster sunotal-cluster --services sunotal-frontend sunotal-auth sunotal-operations sunotal-inventory sunotal-user || true
        continue-on-error: true

      - name: Post-Deployment Automated Test Suite
        run: |
          BASE="https://sunotal.automateuniverse.space"
          echo "🧪 Running Post-Deployment Test Suite against $BASE..."
          
          # Test 1: Frontend Webpage
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 5 --retry-delay 5 "$BASE/" || echo 000)
          echo "Test 1 [Frontend Webpage]: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then echo "❌ Frontend test failed"; exit 1; fi

          # Test 2: Auth Service Healthz
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 5 --retry-delay 5 "$BASE/api/healthz" || echo 000)
          echo "Test 2 [Auth Service Healthz]: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then echo "❌ Healthz test failed"; exit 1; fi

          # Test 3: Admin Login & JWT Token
          LOGIN_RES=$(curl -s -X POST "$BASE/api/auth/login" -H "Content-Type: application/json" -d '{"email":"admin@sunotal.com","password":"admin123"}' || echo "")
          TOKEN=$(echo "$LOGIN_RES" | grep -o '"token":"[^"]*' | cut -d'"' -f4 || echo "")
          if [ -n "$TOKEN" ]; then
            echo "Test 3 [Admin Login API]: HTTP 200 (Token obtained successfully)"
          else
            echo "❌ Admin Login test failed. Response: $LOGIN_RES"
            exit 1
          fi

          # Test 4: Admin Dashboard Stats API
          STATS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$BASE/api/admin/stats" || echo 000)
          echo "Test 4 [Admin Stats API]: HTTP $STATS_STATUS"
          if [ "$STATS_STATUS" != "200" ]; then echo "❌ Admin stats test failed"; exit 1; fi

          # Test 5: Admin Quotations API
          QUOTES_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$BASE/api/admin/quotations" || echo 000)
          echo "Test 5 [Admin Quotations API]: HTTP $QUOTES_STATUS"
          if [ "$QUOTES_STATUS" != "200" ]; then echo "❌ Admin quotations test failed"; exit 1; fi

          echo "🎉 All 5 Post-Deployment Tests Passed Successfully! Deployment is live and error-free."
        continue-on-error: false

