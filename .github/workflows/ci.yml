name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'apps/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
      - 'docker-compose*.yml'
      - 'nginx.conf'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - 'apps/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
      - 'docker-compose*.yml'
      - 'nginx.conf'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_run:
    workflows: ["Infrastructure Automation"]
    types:
      - completed
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20

jobs:
  ci_verify:
    name: Install, Lint, Test & Build Microservices
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
        continue-on-error: true

      - name: Build & Verify Microservices
        run: |
          echo "Verifying backend services..."
          for s in services/*; do
            if [ -f "$s/package.json" ]; then
              echo "Building $s..."
              (cd "$s" && npm install && npm run build)
            fi
          done

          echo "Verifying frontend apps..."
          for a in apps/*; do
            if [ -f "$a/package.json" ]; then
              echo "Building $a..."
              (cd "$a" && npm install && npm run build)
            fi
          done

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Ensure ECR Repositories Exist
        if: steps.login-ecr.outcome == 'success'
        run: |
          for repo in sunotal-backend sunotal-frontend sunotal-auth sunotal-operations sunotal-inventory sunotal-user sunotal-delivery sunotal-support sunotal-user-app sunotal-admin-app sunotal-vendor-app sunotal-delivery-app sunotal-support-app; do
            aws ecr create-repository --repository-name "$repo" --region "${{ env.AWS_DEFAULT_REGION }}" 2>/dev/null || true
          done

      - name: Build Docker images
        if: steps.login-ecr.outcome == 'success'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -t $ECR_REGISTRY/sunotal-backend:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-backend:latest ./services/unified-backend || true
          docker build -t $ECR_REGISTRY/sunotal-frontend:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-frontend:latest -f ./apps/unified-frontend/Dockerfile . || true

      - name: Push Docker images to Amazon ECR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/sunotal-backend:$IMAGE_TAG || true
          docker push $ECR_REGISTRY/sunotal-backend:latest || true
          docker push $ECR_REGISTRY/sunotal-frontend:$IMAGE_TAG || true
          docker push $ECR_REGISTRY/sunotal-frontend:latest || true
        continue-on-error: true
