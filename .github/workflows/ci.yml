name: "CI: Build & Test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  # ─── Job 1: Backend Microservices Build & Type Check ─────────────────────
  backend_microservices_ci:
    name: Microservices Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Microservices
        run: |
          echo "📦 Installing and compiling backend microservices..."
          failed_services=()
          for service in services/*/; do
            if [ -d "$service" ] && [ -f "$service/package.json" ]; then
              echo "⚙️  Building $service..."
              cd "$service"
              if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
              npm run build
              if [ $? -ne 0 ]; then
                failed_services+=("$service")
                echo "❌ Build failed: $service"
              else
                echo "✅ Build OK: $service"
              fi
              cd ../..
            fi
          done
          if [ ${#failed_services[@]} -gt 0 ]; then
            echo "❌ Failed services: ${failed_services[*]}"
            exit 1
          fi

      - name: TypeScript Strict Type Check
        run: |
          echo "🔍 Running TypeScript noEmit type check across all services..."
          for service in services/*/; do
            if [ -d "$service" ] && [ -f "$service/tsconfig.json" ]; then
              echo "  Checking $service..."
              cd "$service"
              npx tsc --noEmit 2>&1 || echo "⚠️  Type issues in $service (non-blocking for now)"
              cd ../..
            fi
          done

  # ─── Job 2: Frontend Applications Compilation ─────────────────────────────
  frontend_apps_ci:
    name: Frontend Applications Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Build Frontend Applications
        run: |
          echo "📦 Compiling and building frontend applications..."
          failed_apps=()
          for app in apps/*/; do
            if [ -d "$app" ] && [ -f "$app/package.json" ]; then
              echo "🎨 Building $app..."
              cd "$app"
              if [ -f "pnpm-lock.yaml" ]; then
                pnpm install --frozen-lockfile
              elif [ -f "package-lock.json" ]; then
                npm ci
              else
                npm install
              fi
              npm run build
              if [ $? -ne 0 ]; then
                failed_apps+=("$app")
                echo "❌ Build failed: $app"
              else
                echo "✅ Build OK: $app"
              fi
              cd ../..
            fi
          done
          if [ ${#failed_apps[@]} -gt 0 ]; then
            echo "❌ Failed apps: ${failed_apps[*]}"
            exit 1
          fi


  # ─── Job 3: Docker Compose Full Stack Integration Test ────────────────────
  docker_compose_testing:
    name: Docker Compose Full Stack Integration Test
    runs-on: ubuntu-latest
    # Run after build jobs pass
    needs: [backend_microservices_ci, frontend_apps_ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create required certs directory (self-signed for CI)
        run: |
          mkdir -p certs
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout certs/privkey.pem \
            -out certs/fullchain.pem \
            -subj "/CN=localhost"

      - name: Start Full Stack via Docker Compose
        run: |
          echo "🐳 Launching complete Sunotal platform stack using Docker Compose..."
          docker compose build --parallel
          docker compose up -d
          echo "⏳ Waiting for services to become healthy..."

      - name: Wait for Microservices to be Ready
        run: |
          echo "🔍 Polling microservice health endpoints..."
          MAX_WAIT=180
          ELAPSED=0
          SERVICES_HEALTHY=false

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALL_HEALTHY=true
            for PORT in 5001 5002 5003 5004 5005 5006 5007; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${PORT}/api/healthz" 2>/dev/null || echo "000")
              if [ "$STATUS" != "200" ]; then
                ALL_HEALTHY=false
                echo "  ⏳ port ${PORT} not ready yet (HTTP $STATUS)"
                break
              fi
            done

            if $ALL_HEALTHY; then
              SERVICES_HEALTHY=true
              echo "✅ All microservices are healthy after ${ELAPSED}s"
              break
            fi

            sleep 5
            ELAPSED=$((ELAPSED + 5))
            echo "  ... waiting (${ELAPSED}s / ${MAX_WAIT}s elapsed)"
          done

          if ! $SERVICES_HEALTHY; then
            echo "⚠️  Services did not all become healthy within ${MAX_WAIT}s — dumping logs"
            docker compose ps
            docker compose logs --tail=100
          fi

      - name: Run Microservice Health Integration Suite
        run: |
          echo "🧪 Running platform health integration tests..."
          node scripts/test-platform-health.js

      - name: Docker Compose Stack Status
        if: always()
        run: docker compose ps

      - name: Teardown Docker Stack
        if: always()
        run: docker compose down -v

  # ─── Job 4: Terraform Format & Validation ─────────────────────────────────
  terraform_ci:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest

    env:
      TF_VERSION: "1.9.3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive
          echo "✅ Terraform formatting is correct"

      - name: Terraform Init & Validate (root)
        run: |
          cd terraform
          terraform init -backend=false -input=false
          terraform validate
          echo "✅ Root Terraform configuration is valid"

      - name: Terraform Validate (all modules)
        run: |
          echo "🔍 Validating all Terraform modules individually..."
          failed_modules=()
          for mod in terraform/modules/*/; do
            [ -d "$mod" ] || continue
            mod_name=$(basename "$mod")
            val_output=$( (cd "$mod" && terraform init -backend=false -input=false -upgrade >/dev/null 2>&1 && terraform validate) 2>&1 )
            if [ $? -eq 0 ]; then
              echo "  ✅ modules/$mod_name"
            else
              echo "  ❌ modules/$mod_name:"
              echo "$val_output"
              failed_modules+=("$mod_name")
            fi
          done
          if [ ${#failed_modules[@]} -gt 0 ]; then
            echo "❌ Failed modules: ${failed_modules[*]}"
            exit 1
          fi
          echo "✅ All Terraform modules validated successfully"

      - name: Terraform Security Scan (tfsec)
        continue-on-error: true
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          tfsec terraform/ --minimum-severity HIGH --no-color 2>&1 | tail -20 || true
          echo "🔒 tfsec scan complete (failures are warnings only)"

