version: '3.8'

services:
  auth-service:
    build: ./auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}

  operations-service:
    build: ./operations-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}

  inventory-service:
    build: ./inventory-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}

  user-service:
    build: ./user-service
    ports:
      - "5008:5008"
    environment:
      - PORT=5008
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}

  delivery-service:
    build: ./delivery-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}

  support-service:
    build: ./support-service
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
