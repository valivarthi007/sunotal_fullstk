name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4

jobs:
  sonartest:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build_test_and_deploy:
    name: Build, Version to S3 & Deploy to EC2
    needs: sonartest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../backend && pnpm install --frozen-lockfile

      - name: Type check and lint
        run: |
          cd frontend && pnpm exec tsc --noEmit
          cd ../backend && pnpm exec tsc --noEmit

      - name: Build applications
        run: |
          cd frontend && pnpm build
          cd ../backend && pnpm build

      - name: Package artifacts
        run: |
          mkdir -p dist/artifacts
          tar -czf dist/artifacts/frontend-build.tgz -C frontend/dist .
          tar --exclude='node_modules' -czf dist/artifacts/backend-build.tgz -C backend .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Upload Versioned Artifacts to S3
        run: |
          BUILD_TAG="${GITHUB_SHA::8}"
          BUCKET_NAME="${{ env.S3_BUCKET_NAME }}"
          
          echo "Uploading build artifacts for commit ${BUILD_TAG} to s3://${BUCKET_NAME}/artifacts/..."
          
          # Upload commit-versioned artifacts to artifacts/${BUILD_TAG}/
          aws s3 cp dist/artifacts/frontend-build.tgz s3://${BUCKET_NAME}/artifacts/${BUILD_TAG}/frontend-build.tgz
          aws s3 cp dist/artifacts/backend-build.tgz s3://${BUCKET_NAME}/artifacts/${BUILD_TAG}/backend-build.tgz
          aws s3 cp docker-compose.yml s3://${BUCKET_NAME}/artifacts/${BUILD_TAG}/docker-compose.yml
          
          # Upload 'latest' pointer for deployment
          aws s3 cp dist/artifacts/frontend-build.tgz s3://${BUCKET_NAME}/artifacts/latest/frontend-build.tgz
          aws s3 cp dist/artifacts/backend-build.tgz s3://${BUCKET_NAME}/artifacts/latest/backend-build.tgz
          aws s3 cp docker-compose.yml s3://${BUCKET_NAME}/artifacts/latest/docker-compose.yml

      - name: Deploy to Private EC2 via AWS SSM Run Command
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=sunotal-frontend" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          DB_HOST=$(aws rds describe-db-instances --db-instance-identifier "sunotal-postgres" --query "DBInstances[0].Endpoint.Address" --output text || echo "")
          BUCKET_NAME="${{ env.S3_BUCKET_NAME }}"
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Failed to find running EC2 instance with tag Name=sunotal-frontend."
            exit 1
          fi

          echo "Checking AWS SSM Agent registration for instance $INSTANCE_ID..."
          SSM_ONLINE=false
          for i in {1..30}; do
            STATUS=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "")
            if [ "$STATUS" = "Online" ]; then
              echo "✅ AWS SSM Agent is Online on instance $INSTANCE_ID!"
              SSM_ONLINE=true
              break
            fi
            echo "Attempt $i/30: SSM Agent status is '$STATUS'. Waiting 10s for initialization..."
            sleep 10
          done

          if [ "$SSM_ONLINE" != "true" ]; then
            echo "::error::Instance $INSTANCE_ID is running but SSM Agent is not Online in AWS Systems Manager."
            exit 1
          fi

          echo "Deploying S3 artifacts directly to Private EC2 instance ($INSTANCE_ID) via AWS SSM..."

          # Send deployment command directly to Private EC2 via AWS SSM API
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Sunotal S3 build artifacts directly to Private EC2" \
            --parameters commands="[
              \"export PATH=\\\$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin:~/.local/share/pnpm\",
              \"export NODE_OPTIONS='--max-old-space-size=512'\",
              \"set -e\",
              \"echo 'Ensuring swap file exists on EC2 instance...'\",
              \"if [ ! -f /swapfile ]; then sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048; sudo chmod 600 /swapfile; sudo mkswap /swapfile; sudo swapon /swapfile; fi\",
              \"echo 'Downloading build artifacts directly from S3 via Gateway Endpoint...'\",
              \"mkdir -p /tmp/sunotal-artifacts\",
              \"aws s3 cp s3://${BUCKET_NAME}/artifacts/latest/frontend-build.tgz /tmp/sunotal-artifacts/frontend-build.tgz\",
              \"aws s3 cp s3://${BUCKET_NAME}/artifacts/latest/backend-build.tgz /tmp/sunotal-artifacts/backend-build.tgz\",
              \"echo 'Extracting frontend build to /var/www/sunotal/...'\",
              \"sudo mkdir -p /var/www/sunotal && sudo rm -rf /var/www/sunotal/*\",
              \"sudo tar -xzf /tmp/sunotal-artifacts/frontend-build.tgz -C /var/www/sunotal/\",
              \"echo 'Extracting backend build to /var/www/sunotal-backend/...'\",
              \"sudo mkdir -p /var/www/sunotal-backend && sudo rm -rf /var/www/sunotal-backend/*\",
              \"sudo tar -xzf /tmp/sunotal-artifacts/backend-build.tgz -C /var/www/sunotal-backend/\",
              \"sudo chown -R ubuntu:www-data /var/www/sunotal /var/www/sunotal-backend\",
              \"cd /var/www/sunotal-backend\",
              \"if [ -n '${DB_HOST}' ] && [ '${DB_HOST}' != 'None' ]; then echo 'DATABASE_URL=postgresql://sunotal:sunotalpass123@${DB_HOST}:5432/sunotal' > .env; else cp -n .env.example .env || true; fi\",
              \"command -v pnpm >/dev/null 2>&1 && pnpm install || npx --yes pnpm@${PNPM_VERSION} install\",
              \"command -v pnpm >/dev/null 2>&1 && pnpm run db:push || npx --yes pnpm@${PNPM_VERSION} run db:push\",
              \"(command -v pnpm >/dev/null 2>&1 && pnpm run db:seed || npx --yes pnpm@${PNPM_VERSION} run db:seed || true)\",
              \"(pm2 restart sunotal-backend --update-env || pm2 start dist/src/index.js --name sunotal-backend)\",
              \"sudo env PATH=\\\$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu || true\",
              \"pm2 save || true\",
              \"sudo systemctl enable nginx && sudo systemctl restart nginx\",
              \"rm -rf /tmp/sunotal-artifacts\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM Command dispatched with CommandId: $COMMAND_ID. Waiting for execution completion..."
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; then
            echo "::error::SSM Command failed! Fetching stdout logs from EC2 instance..."
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text || true
            echo "::error::SSM Command failed! Fetching stderr logs from EC2 instance..."
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text || true
            exit 1
          fi
          echo "Deployment successfully executed via AWS SSM!"
          echo "SSM Execution Logs:"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text || true

      - name: HTTP Health Check via ALB
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "sunotal-alb" --query "LoadBalancers[0].DNSName" --output text)
          if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ]; then
            echo "Running health check against ALB at http://$ALB_DNS..."
            curl --fail --retry 5 --retry-delay 5 http://$ALB_DNS/ || echo "Health check ping complete"
          fi


        