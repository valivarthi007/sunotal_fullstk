apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunotal-user-app
  namespace: sunotal
  labels:
    app: sunotal-user-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sunotal-user-app
  template:
    metadata:
      labels:
        app: sunotal-user-app
    spec:
      containers:
        - name: user-app
          image: sunotal-user-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
