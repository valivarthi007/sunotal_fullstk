name: Infrastructure Teardown

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm teardown of infrastructure'
        required: true
        default: ''

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  destroy_infrastructure:
    name: Destroy Infrastructure with Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error::Confirmation failed. You must type 'DESTROY' to execute teardown."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure DynamoDB State Lock Table Exists
        run: |
          aws dynamodb create-table \
            --table-name sunotal-terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region "${{ env.AWS_REGION }}" || true
          aws dynamodb wait table-exists --table-name sunotal-terraform-locks --region "${{ env.AWS_REGION }}" || true

      - name: Restore Non-Empty State File from S3 Version History
        run: |
          BUCKET_NAME="jcs-raju-sunotal-final"
          KEY="state/terraform.tfstate"
          echo "Inspecting S3 remote state file at s3://${BUCKET_NAME}/${KEY}..."

          aws s3 cp "s3://${BUCKET_NAME}/${KEY}" /tmp/current-state.json 2>/dev/null || echo "{}" > /tmp/current-state.json

          if ! grep -q '"type": *"aws_' /tmp/current-state.json 2>/dev/null; then
            echo "Current state is empty or missing. Searching S3 version history for valid state snapshot..."
            VERSIONS=$(aws s3api list-object-versions --bucket "$BUCKET_NAME" --prefix "$KEY" --query 'Versions[*].VersionId' --output text 2>/dev/null || echo "")
            
            for VID in $VERSIONS; do
              if [ -n "$VID" ] && [ "$VID" != "None" ] && [ "$VID" != "null" ]; then
                aws s3 cp "s3://${BUCKET_NAME}/${KEY}?versionId=${VID}" /tmp/candidate-state.json 2>/dev/null || true
                if grep -q '"type": *"aws_' /tmp/candidate-state.json 2>/dev/null; then
                  echo "Found valid state snapshot versionId: $VID. Restoring state/terraform.tfstate..."
                  aws s3api copy-object \
                    --bucket "$BUCKET_NAME" \
                    --copy-source "${BUCKET_NAME}/${KEY}?versionId=${VID}" \
                    --key "$KEY"
                  echo "✅ Terraform remote state restored successfully!"
                  break
                fi
              fi
            done
          else
            echo "Current remote state file is valid."
          fi

          echo "Clearing stale state lock digest in DynamoDB..."
          aws dynamodb delete-item \
            --table-name sunotal-terraform-locks \
            --key '{"LockID": {"S": "'"${BUCKET_NAME}"'/state/terraform.tfstate-md5"}}' \
            --region "${{ env.AWS_REGION }}" || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Empty S3 Bucket Build Artifacts (Preserve State)
        run: |
          BUCKET_NAME="jcs-raju-sunotal-final"
          echo "Emptying build artifacts in s3://${BUCKET_NAME}/artifacts..."
          aws s3 rm s3://${BUCKET_NAME}/artifacts --recursive || true

      - name: Destroy Infrastructure with Terraform
        run: |
          cd terraform
          terraform init -upgrade
          echo "Destroying managed infrastructure..."
          terraform destroy -auto-approve -var="ami_id=destroy-placeholder" -var="key_name=jcs_raju_laptop"

      - name: Deregister Packer AMIs & Delete EBS Snapshots
        run: |
          echo "Searching for AMIs tagged Project=sunotal or Name=sunotal-frontend-ami..."
          
          AMI_IDS=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=tag:Project,Values=sunotal" \
            --query 'Images[*].ImageId' \
            --output text)
          
          if [ -z "$AMI_IDS" ] || [ "$AMI_IDS" = "None" ]; then
            echo "No tagged AMIs found to deregister."
          else
            for AMI_ID in $AMI_IDS; do
              echo "Processing AMI: $AMI_ID"
              
              SNAPSHOT_IDS=$(aws ec2 describe-images \
                --image-ids "$AMI_ID" \
                --query 'Images[0].BlockDeviceMappings[*].Ebs.SnapshotId' \
                --output text)
              
              echo "Deregistering AMI: $AMI_ID..."
              aws ec2 deregister-image --image-id "$AMI_ID"
              
              for SNAP_ID in $SNAPSHOT_IDS; do
                if [ "$SNAP_ID" != "None" ] && [ -n "$SNAP_ID" ]; then
                  echo "Deleting associated EBS snapshot: $SNAP_ID..."
                  aws ec2 delete-snapshot --snapshot-id "$SNAP_ID" || true
                fi
              done
            done
            echo "All Packer AMI resources deregistered and snapshots purged successfully!"
          fi

      - name: Purge Remaining Orphaned Resources
        run: |
          echo "Checking for lingering EC2 instances tagged Project=sunotal..."
          INST_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=sunotal" "Name=instance-state-name,Values=running,pending,stopped" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)
          if [ -n "$INST_IDS" ] && [ "$INST_IDS" != "None" ]; then
            echo "Terminating lingering instances: $INST_IDS"
            aws ec2 terminate-instances --instance-ids $INST_IDS || true
          fi
          echo "🎉 Infrastructure Teardown Complete! All resources purged."
