name: Infrastructure Automation

on:
  workflow_dispatch:
    inputs:
      force_rebuild_ami:
        description: 'Force rebuild AMI with Packer even if an existing tagged AMI is found'
        type: boolean
        required: false
        default: false
      force_reapply_infra:
        description: 'Force re-apply Terraform even if active running infrastructure is detected'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'terraform/**'
      - 'packer/**'
      - '.github/workflows/infra.yml'

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  validate_and_deploy:
    name: Provision Infrastructure & AMI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure S3 Backend Bucket Exists & Versioning Enabled
        run: |
          BUCKET_NAME="jcs-raju-sunotal-final"
          echo "Ensuring S3 backend bucket $BUCKET_NAME exists..."
          aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null || \
          aws s3api create-bucket --bucket "$BUCKET_NAME" --region "${{ env.AWS_REGION }}" || true
          
          echo "Enabling S3 bucket versioning..."
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled || true

      - name: Ensure DynamoDB State Lock Table Exists
        run: |
          aws dynamodb create-table \
            --table-name sunotal-terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region "${{ env.AWS_REGION }}" || true
          aws dynamodb wait table-exists --table-name sunotal-terraform-locks --region "${{ env.AWS_REGION }}" || true

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "latest"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Validate Packer Template
        run: |
          cd packer
          packer init .
          packer validate .

      - name: Validate Terraform Files
        run: |
          cd terraform
          terraform fmt -check || true
          terraform init -backend=false -upgrade
          terraform validate

      - name: Resolve AMI (Reuse Existing or Build New)
        id: packer_build
        run: |
          FORCE_REBUILD="${{ github.event.inputs.force_rebuild_ami }}"
          EXISTING_AMI_ID=""
          
          if [ "$FORCE_REBUILD" != "true" ]; then
            echo "Checking for existing AMI tagged Name=sunotal-frontend-ami or Project=sunotal..."
            EXISTING_AMI_ID=$(aws ec2 describe-images \
              --owners self \
              --filters "Name=tag:Project,Values=sunotal" "Name=state,Values=available" \
              --query 'reverse(sort_by(Images, &CreationDate))[0].ImageId' \
              --output text)
            
            if [ -z "$EXISTING_AMI_ID" ] || [ "$EXISTING_AMI_ID" = "None" ]; then
              EXISTING_AMI_ID=$(aws ec2 describe-images \
                --owners self \
                --filters "Name=tag:Name,Values=sunotal-frontend-ami" "Name=state,Values=available" \
                --query 'reverse(sort_by(Images, &CreationDate))[0].ImageId' \
                --output text)
            fi
          fi
          
          if [ "$EXISTING_AMI_ID" != "None" ] && [ -n "$EXISTING_AMI_ID" ]; then
            echo "✅ Found existing tagged AMI: $EXISTING_AMI_ID. Reusing AMI (skipping Packer build)."
            echo "ami_id=$EXISTING_AMI_ID" >> $GITHUB_OUTPUT
          else
            echo "No suitable existing AMI found (or force rebuild requested). Building new AMI with Packer..."
            cd packer
            packer build -var="aws_region=${{ env.AWS_REGION }}" .
            MANIFEST_PATH="$GITHUB_WORKSPACE/packer/packer-manifest.json"
            
            if [ -f "$MANIFEST_PATH" ]; then
              AMI_ID=$(grep -o '"artifact_id": *"[^"]*"' "$MANIFEST_PATH" | tail -n1 | cut -d '"' -f4 | cut -d ':' -f2)
              echo "Successfully built AMI ID: $AMI_ID"
              echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
            else
              echo "::error::packer-manifest.json not found at $MANIFEST_PATH"
              exit 1
            fi
          fi

      - name: Deploy Infrastructure with Terraform
        env:
          TF_VAR_ami_id: ${{ steps.packer_build.outputs.ami_id }}
          RAW_PEM_KEY: "${{ secrets.EC2_SSH_KEY }}"
        run: |
          mkdir -p ~/.ssh
          echo "$RAW_PEM_KEY" > ~/.ssh/id_rsa
          tr -d '\r' < ~/.ssh/id_rsa > ~/.ssh/id_rsa.clean
          mv ~/.ssh/id_rsa.clean ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PUB_KEY=$(ssh-keygen -y -f ~/.ssh/id_rsa)
          echo "::add-mask::$PUB_KEY"
          
          cd terraform
          terraform init -upgrade

          EXISTING_INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sunotal-frontend" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")

          EXISTING_ALB=$(aws elbv2 describe-load-balancers \
            --names "sunotal-alb" \
            --query "LoadBalancers[0].DNSName" \
            --output text 2>/dev/null || echo "")

          FORCE_REAPPLY="${{ github.event.inputs.force_reapply_infra }}"

          if [ -n "$EXISTING_INSTANCE" ] && [ "$EXISTING_INSTANCE" != "None" ] && \
             [ -n "$EXISTING_ALB" ] && [ "$EXISTING_ALB" != "None" ] && \
             [ "$FORCE_REAPPLY" != "true" ]; then
            echo "✅ Active infrastructure detected (EC2: $EXISTING_INSTANCE, ALB: $EXISTING_ALB)."
            echo "Skipping terraform apply since infrastructure is already active (set force_reapply_infra=true to override)."
          else
            echo "Planning & Applying Infrastructure Changes..."
            terraform plan -var="ami_id=${TF_VAR_ami_id}" -var="key_name=jcs_raju_laptop"
            
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Applying Infrastructure Changes..."
              terraform apply -auto-approve -var="ami_id=${TF_VAR_ami_id}" -var="key_name=jcs_raju_laptop"
            else
              echo "PR Validation complete — terraform apply skipped for non-dispatch/PR builds."
            fi
          fi
