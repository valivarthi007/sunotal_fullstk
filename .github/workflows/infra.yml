name: Infrastructure Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'
      - 'docker-compose*.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'
      - 'docker-compose*.yml'

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  validate_and_deploy:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Validate Terraform Files
        run: |
          cd terraform
          terraform init -backend=false -upgrade
          terraform validate

      - name: Deploy Infrastructure with Terraform
        env:
          RAW_PEM_KEY: "${{ secrets.EC2_SSH_KEY }}"
        run: |
          mkdir -p ~/.ssh
          echo "$RAW_PEM_KEY" > ~/.ssh/id_rsa
          tr -d '\r' < ~/.ssh/id_rsa > ~/.ssh/id_rsa.clean
          mv ~/.ssh/id_rsa.clean ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PUB_KEY=$(ssh-keygen -y -f ~/.ssh/id_rsa 2>/dev/null || echo "")
          if [ -n "$PUB_KEY" ]; then echo "::add-mask::$PUB_KEY"; fi
          
          cd terraform
          terraform init -upgrade
          terraform plan -var="key_name=jcs_raju_laptop"
          terraform apply -auto-approve -var="key_name=jcs_raju_laptop"
