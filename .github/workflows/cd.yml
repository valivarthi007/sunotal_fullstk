name: Continuous Deployment & Ansible Automation (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  deploy_infrastructure:
    name: Provision & Update Infrastructure via Terraform (Self-Healing State)
    runs-on: ubuntu-latest
    outputs:
      ec2_instance_id: ${{ steps.tf_outputs.outputs.ec2_instance_id }}
      ec2_public_ip: ${{ steps.tf_outputs.outputs.ec2_public_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Initialize & Apply Terraform (Restore State Drift)
        id: terraform
        run: |
          cd terraform
          terraform init -upgrade
          terraform apply -auto-approve

      - name: Extract Infrastructure Outputs
        id: tf_outputs
        run: |
          cd terraform
          INSTANCE_ID=$(terraform output -raw backend_instance_id 2>/dev/null || echo "")
          PUBLIC_IP=$(terraform output -raw backend_public_ip 2>/dev/null || echo "")
          echo "ec2_instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "ec2_public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

  deploy_ansible_microservices:
    name: Ansible Configuration & Microservices Deployment
    runs-on: ubuntu-latest
    needs: deploy_infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Deploy Microservices & Standalone MongoDB via AWS SSM Command
        run: |
          echo "🚀 Executing deployment on EC2 instance..."
          INSTANCE_ID="${{ needs.deploy_infrastructure.outputs.ec2_instance_id }}"
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=sunotal-backend" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || echo "")
          fi

          if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
            echo "✅ Targeting EC2 Instance: $INSTANCE_ID"
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Ansible & Docker Compose Microservices Deployment" \
              --parameters 'commands=["cd /home/ec2-user/app/sunotal_fullstk || exit 0", "git pull origin main", "cd services", "docker compose up -d --build"]' \
              || echo "⚠️ Command dispatched."
          fi
