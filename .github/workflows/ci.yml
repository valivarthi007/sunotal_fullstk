name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4

jobs:
  sonartest:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build_test_and_deploy:
    name: Build, Version to S3 & Deploy to EC2
    needs: sonartest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../backend && pnpm install --frozen-lockfile

      - name: Type check and lint
        run: |
          cd frontend && pnpm exec tsc --noEmit
          cd ../backend && pnpm exec tsc --noEmit

      - name: Build applications
        run: |
          cd frontend && pnpm build
          cd ../backend && pnpm build

      - name: Package artifacts
        run: |
          mkdir -p dist/artifacts
          tar -czf dist/artifacts/frontend-build.tgz -C frontend/dist .
          tar -czf dist/artifacts/backend-build.tgz -C backend dist package.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Upload Versioned Artifacts to S3
        run: |
          BUILD_TAG="${GITHUB_SHA::8}"
          BUCKET_NAME="${{ env.S3_BUCKET_NAME }}"
          
          echo "Uploading build artifacts for commit ${BUILD_TAG} to s3://${BUCKET_NAME}/artifacts/..."
          
          # Upload commit-versioned artifacts to artifacts/${BUILD_TAG}/
          aws s3 cp dist/artifacts/frontend-build.tgz s3://${BUCKET_NAME}/artifacts/${BUILD_TAG}/frontend-build.tgz
          aws s3 cp dist/artifacts/backend-build.tgz s3://${BUCKET_NAME}/artifacts/${BUILD_TAG}/backend-build.tgz
          aws s3 cp docker-compose.yml s3://${BUCKET_NAME}/artifacts/${BUILD_TAG}/docker-compose.yml
          
          # Upload 'latest' pointer for deployment
          aws s3 cp dist/artifacts/frontend-build.tgz s3://${BUCKET_NAME}/artifacts/latest/frontend-build.tgz
          aws s3 cp dist/artifacts/backend-build.tgz s3://${BUCKET_NAME}/artifacts/latest/backend-build.tgz
          aws s3 cp docker-compose.yml s3://${BUCKET_NAME}/artifacts/latest/docker-compose.yml

      - name: Set up SSH Key
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: 
          RAW_PEM_KEY: "${{ secrets.EC2_SSH_KEY }}"
        run: |
          mkdir -p ~/.ssh
          echo "$RAW_PEM_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Deploy from S3 to EC2 & Ensure Boot Persistence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REG: ${{ env.AWS_DEFAULT_REGION }}
        run: |
          EC2_IP=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=sunotal-frontend" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].PublicIpAddress" --output text)
          
          if [ -z "$EC2_IP" ] || [ "$EC2_IP" = "None" ]; then
            echo "Failed to find running EC2 instance with tag Name=sunotal-frontend."
            exit 1
          fi
          
          BUCKET_NAME="${{ env.S3_BUCKET_NAME }}"
          echo "Deploying S3 artifacts directly from s3://${BUCKET_NAME}/artifacts/latest/ to EC2 instance at $EC2_IP..."

          # Wait for SSH port 22 to be reachable with retries
          echo "Verifying SSH connection to EC2..."
          for i in {1..5}; do
            if ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=no ubuntu@$EC2_IP "echo 'SSH connection verified'"; then
              echo "SSH connection successful."
              break
            fi
            echo "Attempt $i failed: SSH timed out, retrying in 10s..."
            sleep 10
          done

          # Execute S3 artifact download & extraction directly inside EC2 SSH session with AWS credentials
          ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=no ubuntu@$EC2_IP "
            export PATH=\$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin
            export AWS_ACCESS_KEY_ID='$AWS_KEY'
            export AWS_SECRET_ACCESS_KEY='$AWS_SECRET'
            export AWS_DEFAULT_REGION='$AWS_REG'
            
            if ! which aws > /dev/null 2>&1; then
              echo 'AWS CLI not found on EC2, installing awscli...'
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq awscli
            fi
            
            set -e
            echo 'Downloading build artifacts & docker-compose directly from S3...'
            mkdir -p /tmp/sunotal-artifacts
            aws s3 cp s3://${BUCKET_NAME}/artifacts/latest/frontend-build.tgz /tmp/sunotal-artifacts/frontend-build.tgz
            aws s3 cp s3://${BUCKET_NAME}/artifacts/latest/backend-build.tgz /tmp/sunotal-artifacts/backend-build.tgz
            aws s3 cp s3://${BUCKET_NAME}/artifacts/latest/docker-compose.yml /home/ubuntu/docker-compose.yml
            
            echo 'Extracting frontend build directly to /var/www/sunotal/...'
            sudo mkdir -p /var/www/sunotal
            sudo rm -rf /var/www/sunotal/*
            sudo tar -xzf /tmp/sunotal-artifacts/frontend-build.tgz -C /var/www/sunotal/
            
            echo 'Extracting backend build to /var/www/sunotal-backend/...'
            sudo mkdir -p /var/www/sunotal-backend
            sudo rm -rf /var/www/sunotal-backend/*
            sudo tar -xzf /tmp/sunotal-artifacts/backend-build.tgz -C /var/www/sunotal-backend/
            sudo chown -R ubuntu:www-data /var/www/sunotal /var/www/sunotal-backend
            
            echo 'Starting PostgreSQL container from downloaded compose file...'
            sudo docker compose -f /home/ubuntu/docker-compose.yml up -d
            
            echo 'Configuring backend & service persistence...'
            cd /var/www/sunotal-backend
            cp -n .env.example .env || true
            npx pnpm@${PNPM_VERSION} install
            npx pnpm@${PNPM_VERSION} run db:push
            (pm2 restart sunotal-backend --update-env || pm2 start dist/src/index.js --name sunotal-backend)
            sudo env PATH=\$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu || true
            pm2 save
            sudo systemctl enable nginx
            sudo systemctl restart nginx
            rm -rf /tmp/sunotal-artifacts
          "

      - name: HTTP Health Check
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          EC2_IP=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=sunotal-frontend" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].PublicIpAddress" --output text)
          if [ -n "$EC2_IP" ] && [ "$EC2_IP" != "None" ]; then
            echo "Running health check against http://$EC2_IP..."
            curl --fail --retry 3 --retry-delay 5 http://$EC2_IP/ || echo "Health check ping complete"
          fi

        