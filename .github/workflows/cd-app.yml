name: "CD: Application Rollout & Live Verification"

on:
  workflow_run:
    workflows: ["CI: Parallel Build & Containerize"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  deploy_microservices:
    name: EC2 SSM Container Rollout & Verification via Ansible
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Ansible
        run: pip install ansible

      - name: Run Ansible Microservices Deployment Playbook
        run: ansible-playbook ansible/deploy.yml

      - name: Verify Live Endpoints & Subdomains via Ansible
        run: ansible-playbook ansible/verify_health.yml
