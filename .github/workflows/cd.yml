name: CD Pipeline

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  deploy:
    name: Deploy Application
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
        continue-on-error: true

      - name: Deploy to AWS ECS Fargate
        run: |
          echo "Checking if ECS cluster 'sunotal-cluster' exists..."
          CLUSTER_STATE=$(aws ecs describe-clusters --clusters sunotal-cluster --query "clusters[0].status" --output text 2>/dev/null || echo "MISSING")

          if [ "$CLUSTER_STATE" != "ACTIVE" ]; then
            echo "❌ Error: ECS Cluster 'sunotal-cluster' is $CLUSTER_STATE."
            echo "👉 You MUST run the 'Infrastructure Automation' workflow (infra.yml) first to provision the ECS cluster, database, target groups, and task definitions via Terraform."
            exit 1
          fi

          echo "Fetching active ECS service names in cluster..."
          ACTIVE_SERVICES=$(aws ecs list-services --cluster sunotal-cluster --query "serviceArns[*]" --output text 2>/dev/null | tr '\t' '\n' | xargs -n1 basename 2>/dev/null || echo "")

          if [ -z "$ACTIVE_SERVICES" ]; then
            echo "⚠️ No active ECS services found in cluster sunotal-cluster."
            echo "👉 Please run the 'Infrastructure Automation' workflow (infra.yml) to provision the ECS cluster and services via Terraform."
          else
            echo "Updating existing ECS Services..."
            for svc in $ACTIVE_SERVICES; do
              echo "Updating service: $svc"
              aws ecs update-service --cluster sunotal-cluster --service "$svc" --force-new-deployment || true
            done

            echo "Waiting for services to reach stable state (in batches of max 8)..."
            echo "$ACTIVE_SERVICES" | xargs -n 8 | while read -r batch; do
              if [ -n "$batch" ]; then
                echo "Waiting for batch: $batch"
                aws ecs wait services-stable --cluster sunotal-cluster --services $batch || true
              fi
            done
          fi
        continue-on-error: true

      - name: Post-Deployment Automated Test Suite
        run: |
          BASE="https://sunotal.automateuniverse.space"
          echo "🧪 Running Post-Deployment Test Suite against $BASE..."

          # Warm-up / Target Group Health Check Readiness Loop
          echo "⏳ Waiting for ALB targets to register and return HTTP 200 (up to 120s)..."
          for i in {1..24}; do
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 5 "$BASE/" || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Target group is healthy and returning HTTP 200!"
              break
            fi
            echo "Warming up container deployment... Attempt $i/24 (HTTP $STATUS)"
            sleep 5
          done

          # Test 1: Customer Frontend Webpage
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 15 "$BASE/" || echo 000)
          echo "Test 1 [Customer Storefront]: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then echo "❌ Customer storefront test failed"; exit 1; fi

          # Test 2: Auth Service Healthz
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 15 --retry 5 --retry-delay 5 "$BASE/api/healthz" || echo 000)
          echo "Test 2 [Auth Service Healthz]: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then echo "❌ Healthz test failed"; exit 1; fi

          # Test 3: Admin Login & JWT Token
          LOGIN_RES=$(curl -s -L -X POST "$BASE/api/auth/login" -H "Content-Type: application/json" -d '{"email":"admin@sunotal.com","password":"admin123"}' || echo "")
          TOKEN=$(echo "$LOGIN_RES" | grep -o '"token":"[^"]*' | cut -d'"' -f4 || echo "")
          if [ -n "$TOKEN" ]; then
            echo "Test 3 [Admin Login API]: HTTP 200 (Token obtained successfully)"
          else
            echo "❌ Admin Login test failed. Response: $LOGIN_RES"
            exit 1
          fi

          # Test 4: Admin Dashboard Stats API
          STATS_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$BASE/api/admin/stats" || echo 000)
          echo "Test 4 [Admin Stats API]: HTTP $STATS_STATUS"
          if [ "$STATS_STATUS" != "200" ]; then echo "❌ Admin stats test failed"; exit 1; fi

          # Test 5: Admin Quotations API
          QUOTES_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$BASE/api/admin/quotations" || echo 000)
          echo "Test 5 [Admin Quotations API]: HTTP $QUOTES_STATUS"
          if [ "$QUOTES_STATUS" != "200" ]; then echo "❌ Admin quotations test failed"; exit 1; fi

          # Test 6: Delivery Active Orders API
          DELIVERY_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "$BASE/api/delivery/orders/active" || echo 000)
          echo "Test 6 [Delivery Active Orders API]: HTTP $DELIVERY_STATUS"
          if [ "$DELIVERY_STATUS" != "200" ]; then echo "❌ Delivery API test failed"; exit 1; fi

          # Test 7: Support Tickets API
          SUPPORT_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "$BASE/api/support/tickets" || echo 000)
          echo "Test 7 [Support Tickets API]: HTTP $SUPPORT_STATUS"
          if [ "$SUPPORT_STATUS" != "200" ]; then echo "❌ Support API test failed"; exit 1; fi

          echo "🎉 All 7 Post-Deployment Tests Passed Successfully! Microservices deployment is live and error-free."
        continue-on-error: false
