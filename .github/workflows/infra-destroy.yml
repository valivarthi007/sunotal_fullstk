name: Infrastructure Teardown

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm teardown of infrastructure'
        required: true
        default: ''

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  destroy_infrastructure:
    name: Destroy Infrastructure with Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error::Confirmation failed. You must type 'DESTROY' to execute teardown."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Restore S3 State & Purge Build Artifacts
        run: |
          BUCKET_NAME="jcs-raju-sunotal-final"
          echo "Inspecting S3 remote state file at s3://${BUCKET_NAME}/state/terraform.tfstate..."
          aws s3 cp "s3://${BUCKET_NAME}/state/terraform.tfstate" /tmp/current-state.json 2>/dev/null || echo "{}" > /tmp/current-state.json

          if ! grep -q '"type": *"aws_' /tmp/current-state.json 2>/dev/null; then
            echo "Searching S3 version history for valid non-empty state snapshot..."
            VERSIONS=$(aws s3api list-object-versions --bucket "${BUCKET_NAME}" --prefix "state/terraform.tfstate" --query 'Versions[*].VersionId' --output text 2>/dev/null || echo "")
            for VID in $VERSIONS; do
              if [ -n "$VID" ] && [ "$VID" != "None" ] && [ "$VID" != "null" ]; then
                aws s3 cp "s3://${BUCKET_NAME}/state/terraform.tfstate?versionId=${VID}" /tmp/candidate-state.json 2>/dev/null || true
                if grep -q '"type": *"aws_' /tmp/candidate-state.json 2>/dev/null; then
                  echo "Restoring valid state version: $VID..."
                  aws s3api copy-object --bucket "${BUCKET_NAME}" --copy-source "${BUCKET_NAME}/state/terraform.tfstate?versionId=${VID}" --key "state/terraform.tfstate"
                  break
                fi
              fi
            done
          fi

          echo "Clearing stale state lock digest in DynamoDB..."
          aws dynamodb delete-item \
            --table-name sunotal-terraform-locks \
            --key '{"LockID": {"S": "'"${BUCKET_NAME}"'/state/terraform.tfstate-md5"}}' \
            --region "${{ env.AWS_REGION }}" || true

          echo "Emptying build artifacts in s3://${BUCKET_NAME}/artifacts..."
          aws s3 rm s3://${BUCKET_NAME}/artifacts --recursive || true

      - name: Destroy Infrastructure with Terraform
        run: |
          cd terraform
          terraform init -upgrade || true
          echo "Destroying managed infrastructure..."
          terraform destroy -auto-approve -var="key_name=jcs_raju_laptop" || true

      - name: Purge Remaining Orphaned Resources (Full AWS us-east-1 Sweeper)
        run: |
          echo "Sweeping & Purging all remaining resources tagged Project=sunotal or named sunotal-* in us-east-1..."

          # 1. Terminate lingering EC2 Instances
          INST_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=sunotal" "Name=instance-state-name,Values=running,pending,stopped" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text 2>/dev/null || echo "")
          if [ -n "$INST_IDS" ] && [ "$INST_IDS" != "None" ]; then
            echo "Terminating lingering instances: $INST_IDS"
            aws ec2 terminate-instances --instance-ids $INST_IDS || true
          fi

          # 2. Delete RDS Instance (if exists)
          if aws rds describe-db-instances --db-instance-identifier "sunotal-postgres" >/dev/null 2>&1; then
            echo "Deleting RDS DB Instance sunotal-postgres..."
            aws rds delete-db-instance --db-instance-identifier "sunotal-postgres" --skip-final-snapshot --delete-automated-backups || true
          fi

          # 3. Delete Load Balancer
          ALB_ARN=$(aws elbv2 describe-load-balancers --names "sunotal-alb" --query "LoadBalancers[0].LoadBalancerArn" --output text 2>/dev/null || echo "")
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            echo "Deleting ALB sunotal-alb ($ALB_ARN)..."
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" || true
          fi

          # 4. Delete Target Group
          TG_ARN=$(aws elbv2 describe-target-groups --names "sunotal-app-tg" --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")
          if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            echo "Deleting Target Group sunotal-app-tg ($TG_ARN)..."
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN" || true
          fi

          # 5. Delete CloudFront Origin Access Control
          OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='sunotal-s3-oac'].Id" --output text 2>/dev/null || echo "")
          if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ]; then
            OAC_ETAG=$(aws cloudfront get-origin-access-control --id "$OAC_ID" --query "ETag" --output text 2>/dev/null || echo "")
            echo "Deleting CloudFront OAC sunotal-s3-oac ($OAC_ID)..."
            aws cloudfront delete-origin-access-control --id "$OAC_ID" --if-match "$OAC_ETAG" || true
          fi

          # 6. Delete IAM Role & Instance Profile & Policy
          if aws iam get-instance-profile --instance-profile-name "sunotal-ec2-instance-profile" >/dev/null 2>&1; then
            echo "Deleting IAM Instance Profile sunotal-ec2-instance-profile..."
            aws iam remove-role-from-instance-profile --instance-profile-name "sunotal-ec2-instance-profile" --role-name "sunotal-ec2-s3-access-role" 2>/dev/null || true
            aws iam delete-instance-profile --instance-profile-name "sunotal-ec2-instance-profile" || true
          fi

          POLICY_ARN=$(aws iam list-policies --query "Policies[?PolicyName=='sunotal-s3-access-policy'].Arn" --output text 2>/dev/null || echo "")
          if [ -n "$POLICY_ARN" ] && [ "$POLICY_ARN" != "None" ]; then
            echo "Detaching & Deleting IAM Policy sunotal-s3-access-policy..."
            aws iam detach-role-policy --role-name "sunotal-ec2-s3-access-role" --policy-arn "$POLICY_ARN" 2>/dev/null || true
            aws iam delete-policy --policy-arn "$POLICY_ARN" || true
          fi

          if aws iam get-role --role-name "sunotal-ec2-s3-access-role" >/dev/null 2>&1; then
            echo "Deleting IAM Role sunotal-ec2-s3-access-role..."
            aws iam delete-role --role-name "sunotal-ec2-s3-access-role" || true
          fi

          # 7. Delete VPC & Subnets (if exists)
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=sunotal-vpc" --query "Vpcs[0].VpcId" --output text 2>/dev/null || echo "")
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Deleting VPC sunotal-vpc ($VPC_ID) subnets & resources..."
            SG_IDS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" --query "SecurityGroups[?GroupName!='default'].GroupId" --output text 2>/dev/null || echo "")
            for SG in $SG_IDS; do
              aws ec2 delete-security-group --group-id "$SG" || true
            done
            aws ec2 delete-vpc --vpc-id "$VPC_ID" || true
          fi

          # 8. Delete Lambda Function (if exists)
          if aws lambda get-function --function-name "sunotal-delete-s3-object" >/dev/null 2>&1; then
            echo "Deleting Lambda function sunotal-delete-s3-object..."
            aws lambda delete-function --function-name "sunotal-delete-s3-object" || true
          fi

          echo "🎉 Complete Clean Sweep Finished! Every sunotal resource in us-east-1 wiped."

      - name: Destroy Terraform Backend Infrastructure
        run: |
          BUCKET_NAME="jcs-raju-sunotal-final"
          
          # Delete DynamoDB Locks Table
          echo "Deleting DynamoDB table sunotal-terraform-locks..."
          aws dynamodb delete-table --table-name sunotal-terraform-locks --region "${{ env.AWS_REGION }}" || true
          aws dynamodb wait table-not-exists --table-name sunotal-terraform-locks --region "${{ env.AWS_REGION }}" || true

          # Empty and delete the versioned S3 bucket
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Emptying versioned S3 bucket $BUCKET_NAME..."
            
            # Fetch all object versions
            VERSIONS=$(aws s3api list-object-versions --bucket "$BUCKET_NAME" --output json --query '{Objects: Versions[].{Key: Key, VersionId: VersionId}}')
            if [ "$VERSIONS" != "null" ] && [ -n "$VERSIONS" ] && echo "$VERSIONS" | grep -q "Key"; then
              echo "Deleting object versions..."
              aws s3api delete-objects --bucket "$BUCKET_NAME" --delete "$VERSIONS" 2>/dev/null || true
            fi
            
            # Fetch all delete markers
            MARKERS=$(aws s3api list-object-versions --bucket "$BUCKET_NAME" --output json --query '{Objects: DeleteMarkers[].{Key: Key, VersionId: VersionId}}')
            if [ "$MARKERS" != "null" ] && [ -n "$MARKERS" ] && echo "$MARKERS" | grep -q "Key"; then
              echo "Deleting delete markers..."
              aws s3api delete-objects --bucket "$BUCKET_NAME" --delete "$MARKERS" 2>/dev/null || true
            fi

            echo "Deleting S3 bucket $BUCKET_NAME..."
            aws s3api delete-bucket --bucket "$BUCKET_NAME" --region "${{ env.AWS_REGION }}" || true
          fi
          
          echo "🎉 Terraform backend S3 bucket and DynamoDB table destroyed successfully."
