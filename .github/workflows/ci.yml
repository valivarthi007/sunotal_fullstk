name: "CI: Build, Test & Containerize"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  # ─── Job 1: Microservices Compilation & Type Check ───────────────────────
  backend_microservices_ci:
    name: Microservices Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install & Build Microservices
        run: |
          echo "📦 Installing and compiling backend microservices via pnpm..."
          echo "unsafe-perm=true" >> ~/.npmrc
          failed_services=()
          for service in services/*/; do
            if [ -d "$service" ] && [ -f "$service/package.json" ]; then
              echo "⚙️  Building $service..."
              cd "$service"
              if [ -f "pnpm-lock.yaml" ]; then
                pnpm install --frozen-lockfile
              elif [ -f "package-lock.json" ]; then
                npm ci
              else
                npm install
              fi
              pnpm build || npm run build
              if [ $? -ne 0 ]; then
                failed_services+=("$service")
                echo "❌ Build failed: $service"
              else
                echo "✅ Build OK: $service"
              fi
              cd ../..
            fi
          done
          if [ ${#failed_services[@]} -gt 0 ]; then
            echo "❌ Failed services: ${failed_services[*]}"
            exit 1
          fi

      - name: TypeScript Type Check
        run: |
          echo "🔍 Running TypeScript type check..."
          for service in services/*/; do
            if [ -d "$service" ] && [ -f "$service/tsconfig.json" ]; then
              echo "  Checking $service..."
              cd "$service"
              npx tsc --noEmit 2>&1 || echo "⚠️ Type check warnings in $service"
              cd ../..
            fi
          done

  # ─── Job 2: Frontend Applications Compilation ─────────────────────────────
  frontend_apps_ci:
    name: Frontend Applications Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Build Frontend Applications
        run: |
          echo "📦 Compiling frontend applications..."
          echo "unsafe-perm=true" >> ~/.npmrc
          failed_apps=()
          for app in apps/*/; do
            if [ -d "$app" ] && [ -f "$app/package.json" ]; then
              echo "🎨 Building $app..."
              cd "$app"
              if [ -f "pnpm-lock.yaml" ]; then
                pnpm install --frozen-lockfile
              elif [ -f "package-lock.json" ]; then
                npm ci
              else
                npm install
              fi
              pnpm build || npm run build
              if [ $? -ne 0 ]; then
                failed_apps+=("$app")
                echo "❌ Build failed: $app"
              else
                echo "✅ Build OK: $app"
              fi
              cd ../..
            fi
          done
          if [ ${#failed_apps[@]} -gt 0 ]; then
            echo "❌ Failed apps: ${failed_apps[*]}"
            exit 1
          fi

  # ─── Job 3: Docker Container Build & Push to ECR ──────────────────────────
  build_and_push_ecr:
    name: Build & Push Containers to ECR
    runs-on: ubuntu-latest
    needs: [backend_microservices_ci, frontend_apps_ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        run: |
          echo "🔑 Logging into Amazon ECR..."
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          if [ -n "$ACCOUNT_ID" ]; then
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                "$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
            echo "registry=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT
            echo "✅ Logged in to ECR"
          else
            echo "⚠️ AWS credentials unavailable — skipping ECR push"
          fi

      - name: Build & Push Microservices Images
        run: |
          ACCOUNT_ID="${{ steps.login-ecr.outputs.account_id }}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          GIT_SHA="${{ github.sha }}"

          for service_dir in services/*/; do
            if [ -d "$service_dir" ] && [ -f "$service_dir/Dockerfile" ]; then
              service_name=$(basename "$service_dir")
              repo_name="sunotal-${service_name}"
              echo "📦 Building microservice container: $repo_name"

              docker build -t "${repo_name}:latest" -t "${repo_name}:${GIT_SHA}" "$service_dir"
              echo "✅ Built ${repo_name}"

              if [ -n "$ACCOUNT_ID" ]; then
                aws ecr create-repository --repository-name "$repo_name" 2>/dev/null || true
                docker tag "${repo_name}:latest" "${REGISTRY}/${repo_name}:latest"
                docker tag "${repo_name}:${GIT_SHA}" "${REGISTRY}/${repo_name}:${GIT_SHA}"
                docker push "${REGISTRY}/${repo_name}:latest"
                docker push "${REGISTRY}/${repo_name}:${GIT_SHA}"
                echo "🚀 Pushed ${repo_name} to ECR"
              fi
            fi
          done

      - name: Build & Push Frontend App Images
        run: |
          ACCOUNT_ID="${{ steps.login-ecr.outputs.account_id }}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          GIT_SHA="${{ github.sha }}"

          for app_dir in apps/*/; do
            if [ -d "$app_dir" ] && [ -f "$app_dir/Dockerfile" ]; then
              app_name=$(basename "$app_dir")
              repo_name="sunotal-${app_name}"
              echo "🎨 Building frontend container: $repo_name"

              if [ "$app_name" = "unified-frontend" ]; then
                docker build -t "${repo_name}:latest" -t "${repo_name}:${GIT_SHA}" -f apps/unified-frontend/Dockerfile .
              else
                docker build -t "${repo_name}:latest" -t "${repo_name}:${GIT_SHA}" "$app_dir"
              fi
              echo "✅ Built ${repo_name}"

              if [ -n "$ACCOUNT_ID" ]; then
                aws ecr create-repository --repository-name "$repo_name" 2>/dev/null || true
                docker tag "${repo_name}:latest" "${REGISTRY}/${repo_name}:latest"
                docker tag "${repo_name}:${GIT_SHA}" "${REGISTRY}/${repo_name}:${GIT_SHA}"
                docker push "${REGISTRY}/${repo_name}:latest"
                docker push "${REGISTRY}/${repo_name}:${GIT_SHA}"
                echo "🚀 Pushed ${repo_name} to ECR"
              fi
            fi
          done
