name: Status Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          npm install -g pnpm

      - name: Build frontend
        working-directory: frontend
        run: |
          # ensure a modern pnpm and allow native build scripts in CI
          npm install -g pnpm@latest
          pnpm set config auto-approve-builds true
          pnpm install --frozen-lockfile
          pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image to ECR
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
          IMAGE=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker build -t ${IMAGE} -f frontend/Dockerfile frontend
          docker push ${IMAGE}

          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Deploy new task definition and update service
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          # Fetch running service taskDefinition
          CLUSTER=${CLUSTER}
          SERVICE=${SERVICE}

          echo "Describing service $SERVICE on cluster $CLUSTER"
          CURRENT_TD_ARN=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          echo "Current task definition: $CURRENT_TD_ARN"

          TD_JSON=$(aws ecs describe-task-definition --task-definition "$CURRENT_TD_ARN" --query 'taskDefinition' --output json)

          # Build a minimal new task definition JSON using existing fields but updating the frontend container image
          NEW_TD=$(echo "$TD_JSON" | jq --arg IMG "$IMAGE" '.containerDefinitions |= map(if .name=="frontend" then .image=$IMG else . end) | {family: .family, taskRoleArn: .taskRoleArn, executionRoleArn: .executionRoleArn, networkMode: .networkMode, containerDefinitions: .containerDefinitions, requiresCompatibilities: .requiresCompatibilities, cpu: .cpu, memory: .memory, volumes: .volumes}')

          echo "Registering new task definition..."
          REGISTER_OUTPUT=$(aws ecs register-task-definition --cli-input-json "$NEW_TD")
          NEW_TD_ARN=$(echo "$REGISTER_OUTPUT" | jq -r '.taskDefinition.taskDefinitionArn')
          echo "Registered: $NEW_TD_ARN"

          echo "Updating service to use new task definition..."
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_TD_ARN" --force-new-deployment

          echo "Deployment triggered"

      - name: Wait for ECS service to stabilize
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          echo "Waiting for service $SERVICE to become stable..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Service is stable."

      - name: Invalidate CloudFront (optional)
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "Creating CloudFront invalidation for distribution $DISTRIBUTION_ID"
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"

      - name: Smoke test deployed site
        env:
          HOST: ${{ secrets.APP_HOST }}
        run: |
          set -e
          if [ -z "$HOST" ]; then echo "APP_HOST secret is not set; skipping smoke tests"; exit 0; fi
          echo "Checking root and important routes..."
          for path in "/" "/admin/products" "/vendor" "/api/healthz"; do
            echo "GET $HOST$path"
            http_status=$(curl -s -o /dev/null -w "%{http_code}" -L "$HOST$path")
            echo "$path -> $http_status"
            if [ "$path" = "/api/healthz" ]; then
              if [ "$http_status" != "200" ]; then echo "API health check failed"; exit 1; fi
            else
              if [ "$http_status" != "200" ]; then echo "Page $path returned $http_status"; exit 1; fi
            fi
          done

          # verify assets are not HTML (avoid stale index.html being served as asset)
          ASSET_PATHS=("/assets/index-*.js" "/assets/index-*.css")
          for p in "${ASSET_PATHS[@]}"; do
            echo "Checking asset glob $p"
            # Resolve a single asset by listing directory (requires directory listing enabled); fall back to known hashed name if provided via secret
            if [ -n "${{ secrets.KNOWN_ASSET_PATH }}" ]; then
              asset="${{ secrets.KNOWN_ASSET_PATH }}"
            else
              # try a couple of common names
              asset="/assets/index-CUOjj7vI.css"
            fi
            ct=$(curl -sI -L "$HOST$asset" | tr -d '\r' | awk -F": " '/Content-Type/ {print $2}' | head -n1 || true)
            echo "$asset content-type: $ct"
            if echo "$ct" | grep -q "text/html"; then echo "Asset $asset served HTML (likely stale deploy)"; exit 1; fi
          done
