name: CI Pipeline # Force Trigger Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4

jobs:
  sonartest:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  ci_verify:
    name: Install, Lint, Test & Build
    needs: sonartest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../backend && pnpm install --frozen-lockfile

      - name: Install Playwright Browsers (for E2E)
        run: |
          cd frontend && npx playwright install --with-deps chromium

      - name: Type check and lint
        run: |
          cd frontend && pnpm exec tsc --noEmit
          cd ../backend && pnpm exec tsc --noEmit

      - name: Run Backend Tests
        run: |
          cd backend && pnpm run test -- --reporter=json --outputFile=backend-report.json

      - name: Run Frontend Tests
        run: |
          cd frontend && pnpm run test -- --reporter=json --outputFile=frontend-report.json

      - name: Run Frontend E2E Tests
        run: |
          cd frontend && pnpm run test:e2e
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Build Docker images
        run: |
          docker build -t sunotal-frontend:latest ./frontend
          docker build -t sunotal-auth:latest ./backend/services/auth-service
          docker build -t sunotal-operations:latest ./backend/services/operations-service
          docker build -t sunotal-inventory:latest ./backend/services/inventory-service
          docker build -t sunotal-user:latest ./backend/services/user-service

      - name: Run Trivy vulnerability scanner (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sunotal-frontend:latest'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Run Trivy vulnerability scanner (Auth Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sunotal-auth:latest'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Run Trivy vulnerability scanner (Operations Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sunotal-operations:latest'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Run Trivy vulnerability scanner (Inventory Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sunotal-inventory:latest'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Run Trivy vulnerability scanner (User Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sunotal-user:latest'
          exit-code: '1'
          severity: 'CRITICAL'