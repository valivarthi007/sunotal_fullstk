version: '3.8'

services:
  gateway:
    image: nginx:1.25-alpine
    container_name: sunotal-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - delivery-service

  frontend:
    image: ${ECR_REGISTRY}/sunotal-frontend:${IMAGE_TAG}
    container_name: sunotal-frontend
    restart: unless-stopped
    expose:
      - "80"

  backend:
    image: ${ECR_REGISTRY}/sunotal-backend:${IMAGE_TAG}
    container_name: sunotal-backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=${REDIS_HOST}
      - SESSION_SECRET=${SESSION_SECRET}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - FRONTEND_URL=${FRONTEND_URL}

  delivery-service:
    image: ${ECR_REGISTRY}/sunotal-delivery:${IMAGE_TAG}
    container_name: sunotal-delivery
    restart: unless-stopped
    expose:
      - "5006"
    environment:
      - PORT=5006
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=${REDIS_HOST}
      - SESSION_SECRET=${SESSION_SECRET}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - FRONTEND_URL=${FRONTEND_URL}
