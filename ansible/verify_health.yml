---
- name: "Verify Live Endpoints & Subdomains Health"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    domains:
      - "https://sunotal.automateuniverse.space"
      - "https://admin-sunotal.automateuniverse.space"
      - "https://vendor-sunotal.automateuniverse.space"
      - "https://delivery-sunotal.automateuniverse.space"
      - "https://support-sunotal.automateuniverse.space"
      - "https://monitoring-sunotal.automateuniverse.space"

  tasks:
    - name: Test endpoint reachability
      uri:
        url: "{{ item }}"
        method: GET
        validate_certs: false
        status_code: [200, 301, 302]
      loop: "{{ domains }}"
      register: uri_check
      ignore_errors: true

    - name: Report Endpoint Health Status
      debug:
        msg: "Endpoint {{ item.item }} returned HTTP status {{ item.status | default('failed') }}"
      loop: "{{ uri_check.results }}"
