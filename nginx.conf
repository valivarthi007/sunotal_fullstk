events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 20M;

    sendfile on;
    keepalive_timeout 65;

    # 1. Customer Grocery Storefront (sunotal.automateuniverse.space & default fallback)
    server {
        listen 80;
        server_name sunotal.automateuniverse.space localhost "";

        location / {
            proxy_pass http://user-app:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/ {
            proxy_pass http://auth-service:5001;
            proxy_set_header Host $host;
        }

        location /api/delivery/ {
            proxy_pass http://delivery-service:5006;
            proxy_set_header Host $host;
        }

        location /api/support/ {
            proxy_pass http://support-service:5007;
            proxy_set_header Host $host;
        }

        location /api/inventory/ {
            proxy_pass http://inventory-service:5003;
            proxy_set_header Host $host;
        }

        location /api/users/ {
            proxy_pass http://user-service:5004;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://operations-service:5002;
            proxy_set_header Host $host;
        }
    }

    # 2. Admin Control Center (admin-sunotal.automateuniverse.space)
    server {
        listen 80;
        server_name admin-sunotal.automateuniverse.space admin.automateuniverse.space;

        location / {
            proxy_pass http://admin-app:80;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://operations-service:5002;
            proxy_set_header Host $host;
        }
    }

    # 3. Farmer & Vendor Portal (vendor-sunotal.automateuniverse.space)
    server {
        listen 80;
        server_name vendor-sunotal.automateuniverse.space farmer-sunotal.automateuniverse.space;

        location / {
            proxy_pass http://vendor-app:80;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://operations-service:5002;
            proxy_set_header Host $host;
        }
    }

    # 4. Delivery Partner Portal (delivery-sunotal.automateuniverse.space)
    server {
        listen 80;
        server_name delivery-sunotal.automateuniverse.space rider-sunotal.automateuniverse.space;

        location / {
            proxy_pass http://delivery-app:80;
            proxy_set_header Host $host;
        }

        location /api/delivery/ {
            proxy_pass http://delivery-service:5006;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://operations-service:5002;
            proxy_set_header Host $host;
        }
    }

    # 5. Internal Support Case Portal (support-sunotal.automateuniverse.space)
    server {
        listen 80;
        server_name support-sunotal.automateuniverse.space help-sunotal.automateuniverse.space;

        location / {
            proxy_pass http://support-app:80;
            proxy_set_header Host $host;
        }

        location /api/support/ {
            proxy_pass http://support-service:5007;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://operations-service:5002;
            proxy_set_header Host $host;
        }
    }
}
