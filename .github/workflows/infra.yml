name: Infrastructure Automation

on:
  workflow_dispatch:
    inputs:
      compute_target:
        description: 'Target Compute Platform (eks or ecs)'
        type: choice
        options:
          - eks
          - ecs
        default: 'eks'
        required: true
      force_reapply_infra:
        description: 'Force re-apply Terraform even if active running infrastructure is detected'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  validate_and_deploy:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure S3 Backend Bucket Exists & Versioning Enabled
        run: |
          BUCKET_NAME="jcs-raju-sunotal-final"
          echo "Ensuring S3 backend bucket $BUCKET_NAME exists..."
          aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null || \
          aws s3api create-bucket --bucket "$BUCKET_NAME" --region "${{ env.AWS_REGION }}" || true
          
          echo "Enabling S3 bucket versioning..."
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled || true

          echo "✅ S3 bucket folder structure initialized"

      - name: Ensure DynamoDB State Lock Table Exists
        run: |
          aws dynamodb create-table \
            --table-name sunotal-terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region "${{ env.AWS_REGION }}" || true
          aws dynamodb wait table-exists --table-name sunotal-terraform-locks --region "${{ env.AWS_REGION }}" || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Validate Terraform Files
        run: |
          cd terraform
          terraform fmt -check || true
          terraform init -backend=false -upgrade
          terraform validate

      - name: Deploy Infrastructure with Terraform
        env:
          RAW_PEM_KEY: "${{ secrets.EC2_SSH_KEY }}"
          COMPUTE_TARGET: ${{ inputs.compute_target || 'eks' }}
        run: |
          mkdir -p ~/.ssh
          echo "$RAW_PEM_KEY" > ~/.ssh/id_rsa
          tr -d '\r' < ~/.ssh/id_rsa > ~/.ssh/id_rsa.clean
          mv ~/.ssh/id_rsa.clean ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PUB_KEY=$(ssh-keygen -y -f ~/.ssh/id_rsa)
          echo "::add-mask::$PUB_KEY"
          
          cd terraform
          terraform init -upgrade

          echo "Planning Infrastructure Changes for target: ${COMPUTE_TARGET}..."
          terraform plan -var="key_name=jcs_raju_laptop" -var="compute_target=${COMPUTE_TARGET}"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Applying Infrastructure Changes for target: ${COMPUTE_TARGET}..."
            terraform apply -auto-approve -var="key_name=jcs_raju_laptop" -var="compute_target=${COMPUTE_TARGET}"
            
            echo "Storing active compute_target in AWS SSM Parameter Store..."
            aws ssm put-parameter --name "/sunotal/compute_target" --value "${COMPUTE_TARGET}" --type "String" --overwrite || true
          else
            echo "PR Validation complete — terraform apply skipped for non-dispatch/PR builds."
          fi
