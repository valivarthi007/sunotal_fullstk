version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sunotal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sunotal_mongodata:/data/db

  redis:
    image: redis:7-alpine
    container_name: sunotal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sunotal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - SESSION_SECRET=sunotal-super-secret-session-key
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  delivery-service:
    build:
      context: ./backend/services/delivery-service
      dockerfile: Dockerfile
    container_name: sunotal-delivery
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - SESSION_SECRET=sunotal-super-secret-session-key
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5006/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: sunotal-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sunotal_promdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: sunotal-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - sunotal_grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  sunotal_mongodata:
  sunotal_promdata:
  sunotal_grafanadata:
