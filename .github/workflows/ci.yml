name: "CI: Build, Test & Containerize"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  # ─── Job 1: Independent Microservices & Apps Ansible Build ───────────────
  ansible_ci_build:
    name: Microservices & Apps Build via Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install Ansible
        run: pip install ansible

      - name: Run Ansible CI Build Playbook
        run: ansible-playbook ansible/ci_build.yml

  # ─── Job 2: Docker Container Build & Push to ECR via Ansible ─────────────
  build_and_push_ecr:
    name: Container Build & Push to ECR via Ansible
    runs-on: ubuntu-latest
    needs: [ansible_ci_build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Ansible
        run: pip install ansible

      - name: Run Ansible ECR Build & Push Playbook
        run: ansible-playbook ansible/build_and_push_ecr.yml
        env:
          GITHUB_SHA: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
