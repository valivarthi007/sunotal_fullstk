name: Infrastructure Teardown

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm teardown of infrastructure'
        required: true
        default: ''

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  destroy_infrastructure:
    name: Destroy Infrastructure (AWS CLI & Terraform)
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error::Confirmation failed. You must type 'DESTROY' to execute teardown."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Purge ECR Repositories & Images
        run: |
          echo "Force purging all ECR repositories to prevent RepositoryNotEmptyException..."
          for repo in sunotal-frontend sunotal-auth sunotal-operations sunotal-inventory sunotal-user; do
            if aws ecr describe-repositories --repository-names "$repo" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
              echo "Force deleting repository: $repo"
              aws ecr delete-repository --repository-name "$repo" --force --region "${{ env.AWS_REGION }}" || true
            fi
          done

      - name: Purge Non-State S3 Folders (Preserve State File)
        run: |
          BUCKET_NAME="jcs-raju-sunotal-final"
          echo "Purging non-state application objects (artifacts/, uploads/, logs/) in s3://${BUCKET_NAME}..."
          echo "SAFEGUARD: Preserving state/* (terraform.tfstate) for Terraform teardown..."
          aws s3 rm "s3://${BUCKET_NAME}" --recursive --exclude "state/*" || true

      - name: Deregister Load Balancer Targets
        run: |
          echo "Deregistering any active target IPs from ALB target groups..."
          for tg in sunotal-frontend-tg sunotal-auth-tg sunotal-operations-tg sunotal-inventory-tg sunotal-user-tg; do
            TG_ARN=$(aws elbv2 describe-target-groups --names "$tg" --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")
            if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
              TARGETS=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" --query "TargetHealthDescriptions[*].Target.Id" --output text 2>/dev/null || echo "")
              for target in $TARGETS; do
                if [ -n "$target" ] && [ "$target" != "None" ]; then
                  echo "Deregistering target $target from $tg..."
                  aws elbv2 deregister-targets --target-group-arn "$TG_ARN" --targets Id=$target 2>/dev/null || true
                fi
              done
            fi
          done

      - name: Scale Down & Stop ECS Tasks (if active)
        run: |
          if aws ecs describe-clusters --clusters sunotal-cluster --region "${{ env.AWS_REGION }}" --query "clusters[0].status" --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "Scaling down ECS services in sunotal-cluster..."
            for svc in sunotal-frontend sunotal-auth sunotal-operations sunotal-inventory sunotal-user; do
              aws ecs update-service --cluster sunotal-cluster --service "$svc" --desired-count 0 --region "${{ env.AWS_REGION }}" 2>/dev/null || true
            done
            
            TASKS=$(aws ecs list-tasks --cluster sunotal-cluster --region "${{ env.AWS_REGION }}" --query "taskArns[]" --output text 2>/dev/null || echo "")
            for task in $TASKS; do
              if [ -n "$task" ] && [ "$task" != "None" ]; then
                echo "Stopping ECS Task: $task"
                aws ecs stop-task --cluster sunotal-cluster --task "$task" --reason "Pipeline teardown" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
              fi
            done
          fi

      - name: Teardown EKS Cluster, Node Groups & Fargate Profiles (if active)
        run: |
          CLUSTER_NAME="sunotal-cluster"
          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "EKS Cluster $CLUSTER_NAME detected. Starting clean teardown..."
            
            # Delete Node Groups
            NODEGROUPS=$(aws eks list-nodegroups --cluster-name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}" --query "nodegroups[]" --output text 2>/dev/null || echo "")
            for ng in $NODEGROUPS; do
              if [ -n "$ng" ] && [ "$ng" != "None" ]; then
                echo "Initiating deletion of Node Group: $ng"
                aws eks delete-nodegroup --cluster-name "$CLUSTER_NAME" --nodegroup-name "$ng" --region "${{ env.AWS_REGION }}" || true
              fi
            done
            
            # Delete Fargate Profiles
            PROFILES=$(aws eks list-fargate-profiles --cluster-name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}" --query "fargateProfileNames[]" --output text 2>/dev/null || echo "")
            for fp in $PROFILES; do
              if [ -n "$fp" ] && [ "$fp" != "None" ]; then
                echo "Initiating deletion of Fargate Profile: $fp"
                aws eks delete-fargate-profile --cluster-name "$CLUSTER_NAME" --fargate-profile-name "$fp" --region "${{ env.AWS_REGION }}" || true
              fi
            done

            # Wait for Node Groups to be fully deleted
            for ng in $NODEGROUPS; do
              if [ -n "$ng" ] && [ "$ng" != "None" ]; then
                echo "Waiting for Node Group $ng to be fully deleted..."
                aws eks wait nodegroup-deleted --cluster-name "$CLUSTER_NAME" --nodegroup-name "$ng" --region "${{ env.AWS_REGION }}" || true
              fi
            done

            # Wait for Fargate Profiles to be fully deleted
            for fp in $PROFILES; do
              if [ -n "$fp" ] && [ "$fp" != "None" ]; then
                echo "Waiting for Fargate Profile $fp to be fully deleted..."
                while aws eks describe-fargate-profile --cluster-name "$CLUSTER_NAME" --fargate-profile-name "$fp" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; do
                  echo "Fargate profile $fp is still deleting..."
                  sleep 15
                done
              fi
            done

            # Delete EKS Cluster with retries
            echo "Deleting EKS Cluster $CLUSTER_NAME..."
            for attempt in {1..5}; do
              if aws eks delete-cluster --name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}"; then
                echo "Cluster deletion initiated successfully."
                break
              else
                echo "Delete cluster attempt $attempt failed. Waiting 30 seconds before retry..."
                sleep 30
              fi
            done

            echo "Waiting for EKS cluster deletion to finish..."
            aws eks wait cluster-deleted --name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
            echo "EKS cluster teardown complete."
          else
            echo "No active EKS cluster found."
          fi

      - name: Purge RDS Database Instances & Unattached Network Interfaces
        run: |
          echo "Purging RDS Database Instances (sunotal-postgres & raju-sunotal-db)..."
          for db in sunotal-postgres raju-sunotal-db; do
            if aws rds describe-db-instances --db-instance-identifier "$db" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
              echo "Initiating deletion of RDS Instance: $db"
              aws rds delete-db-instance --db-instance-identifier "$db" --skip-final-snapshot --delete-automated-backups --region "${{ env.AWS_REGION }}" 2>/dev/null || true
            fi
          done

          echo "Cleaning up SSM Parameters..."
          aws ssm delete-parameter --name "/sunotal/compute_target" --region "${{ env.AWS_REGION }}" 2>/dev/null || true

          echo "Cleaning up unattached Network Interfaces (ENIs)..."
          ENIS=$(aws ec2 describe-network-interfaces --region "${{ env.AWS_REGION }}" --filters "Name=description,Values=*sunotal*,*elbv2*,*aws-K8S*" "Name=status,Values=available" --query "NetworkInterfaces[*].NetworkInterfaceId" --output text 2>/dev/null || echo "")
          for eni in $ENIS; do
            if [ -n "$eni" ] && [ "$eni" != "None" ]; then
              echo "Deleting unattached ENI: $eni"
              aws ec2 delete-network-interface --network-interface-id "$eni" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
            fi
          done

      - name: Clear Stale DynamoDB State Locks
        run: |
          echo "Clearing any stale state lock items from DynamoDB table sunotal-terraform-locks..."
          LOCK_ITEMS=$(aws dynamodb scan --table-name sunotal-terraform-locks --region "${{ env.AWS_REGION }}" --query "Items[*].LockID.S" --output text 2>/dev/null || echo "")
          for lock_id in $LOCK_ITEMS; do
            if [ -n "$lock_id" ] && [ "$lock_id" != "None" ]; then
              echo "Removing stale lock item: $lock_id"
              aws dynamodb delete-item --table-name sunotal-terraform-locks --region "${{ env.AWS_REGION }}" --key "{\"LockID\": {\"S\": \"$lock_id\"}}" || true
            fi
          done

      - name: Destroy Infrastructure with Terraform (Multi-Pass)
        run: |
          cd terraform
          terraform init -upgrade
          echo "Executing Terraform destroy..."
          
          # Pass 1: Destroy EKS target if state contains EKS module
          terraform destroy -auto-approve -lock=false -var="key_name=jcs_raju_laptop" -var="compute_target=eks" || true
          
          # Pass 2: Destroy ECS target & remaining shared infrastructure (VPC, RDS, ALB, Security Groups)
          terraform destroy -auto-approve -lock=false -var="key_name=jcs_raju_laptop" -var="compute_target=ecs" || true

          # Final Pass: Fallback destroy to guarantee 100% clean state
          terraform destroy -auto-approve -lock=false -var="key_name=jcs_raju_laptop"

      - name: Post-Teardown Cleanup & CloudWatch Logs Removal
        run: |
          echo "Performing final sweep of CloudWatch log groups..."
          LOG_GROUPS=$(aws logs describe-log-groups --region "${{ env.AWS_REGION }}" --query "logGroups[?contains(logGroupName, 'sunotal')].logGroupName" --output text 2>/dev/null || echo "")
          for lg in $LOG_GROUPS; do
            if [ -n "$lg" ] && [ "$lg" != "None" ]; then
              echo "Deleting CloudWatch Log Group: $lg"
              aws logs delete-log-group --log-group-name "$lg" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
            fi
          done
          echo "Post-teardown cleanup complete. All application resources destroyed."
