name: "Infra: Terraform Provisioning"

on:
  # Only plan on push — apply requires explicit approval via workflow_dispatch
  push:
    branches:
      - main
    paths:
      - 'terraform/**'   # Only trigger when terraform files actually change

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      deployment_mode:
        description: 'Target Infrastructure Architecture (EC2 vs ECS Fargate)'
        required: true
        default: 'ec2_single_instance'
        type: choice
        options:
          - ec2_single_instance
          - ecs_fargate_production

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  TF_VERSION: "1.9.3"
  TF_IN_AUTOMATION: "true"
  # Prevent Terraform from asking for input
  TF_INPUT: "false"

jobs:
  terraform_provision:
    name: Terraform ${{ github.event.inputs.action || 'plan' }} (${{ github.event.inputs.deployment_mode || 'ec2_single_instance' }})
    runs-on: ubuntu-latest
    # Protect destroy from accidental runs — only allow via workflow_dispatch
    if: |
      github.event.inputs.action != 'destroy' ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      pull-requests: write   # Allow posting plan output as PR comment

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          USE_EC2="true"
          DEV_MODE="true"
          if [ "${{ github.event.inputs.deployment_mode }}" = "ecs_fargate_production" ]; then
            USE_EC2="false"
            DEV_MODE="false"
          fi

          echo "🚀 Planning for deployment mode: ${{ github.event.inputs.deployment_mode || 'ec2_single_instance' }} (use_ec2_single_instance=${USE_EC2})"
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=60s \
            -var="use_ec2_single_instance=${USE_EC2}" \
            -var="dev_mode=${DEV_MODE}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET || 'sunotal_jwt_secret_2026_super_secure' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD || 'SunotalPostgres2026SecurePass!' }}

      # Post plan output as a PR comment for review
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## Terraform Plan Results

            | Step | Status |
            |------|--------|
            | Format | ${{ steps.fmt.outcome }} |
            | Init   | ${{ steps.init.outcome }} |
            | Validate | ${{ steps.validate.outcome }} |
            | Plan | ${{ steps.plan.outcome }} |
            | Target Mode | \`${{ github.event.inputs.deployment_mode || 'ec2_single_instance' }}\` |

            > Pushed by @${{ github.actor }} — Merge to \`main\` and run **workflow_dispatch → apply** to provision.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # SAFETY: Apply only runs when explicitly requested via workflow_dispatch → apply
      # Never auto-applies on push to main
      - name: Terraform Apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          echo "🏗️ Applying Terraform plan (${{ github.event.inputs.deployment_mode || 'ec2_single_instance' }}) to AWS..."
          terraform apply \
            -input=false \
            -auto-approve \
            -lock-timeout=120s \
            tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD || 'SunotalPostgres2026SecurePass!' }}

      # DANGER: Destroy requires explicit action=destroy — protected by separate condition above
      - name: Terraform Destroy
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'destroy'
        run: |
          USE_EC2="true"
          DEV_MODE="true"
          if [ "${{ github.event.inputs.deployment_mode }}" = "ecs_fargate_production" ]; then
            USE_EC2="false"
            DEV_MODE="false"
          fi

          echo "💥 Destroying infrastructure (${{ github.event.inputs.deployment_mode || 'ec2_single_instance' }}) — this is irreversible!"
          terraform destroy \
            -input=false \
            -auto-approve \
            -lock-timeout=120s \
            -var="use_ec2_single_instance=${USE_EC2}" \
            -var="dev_mode=${DEV_MODE}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET || 'sunotal_jwt_secret_2026_super_secure' }}"
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD || 'SunotalPostgres2026SecurePass!' }}

      - name: Post Terraform Summary
        if: always()
        run: |
          echo "## 🏗️ Terraform Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Outcome |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ${{ steps.fmt.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Init | ${{ steps.init.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ steps.validate.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plan | ${{ steps.plan.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ github.event.inputs.action || 'plan-only' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Mode | ${{ github.event.inputs.deployment_mode || 'ec2_single_instance' }} |" >> $GITHUB_STEP_SUMMARY
