sonar.projectKey=valivarthi007_sunotal_fullstk
sonar.organization=valivarthi007
sonar.projectName=Sunotal Full-Stack Application
sonar.projectVersion=1.0

# Source directories — all backend microservices + frontend
sonar.sources=backend/src,backend/services,frontend/src

# Exclusions: skip generated code, deps, tests, and build artifacts
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js,**/migrations/**,**/drizzle/**

# Test file paths (used for coverage reporting)
sonar.tests=backend/src,backend/services,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js

# Encoding
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=browser,nodejs