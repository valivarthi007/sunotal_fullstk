version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sunotal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sunotal_mongodata:/data/db

  redis:
    image: redis:7-alpine
    container_name: sunotal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  gateway:
    image: nginx:1.25-alpine
    container_name: sunotal-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-app
      - admin-app
      - vendor-app
      - delivery-app
      - support-app
      - auth-service
      - operations-service
      - inventory-service
      - user-service
      - delivery-service
      - support-service

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: sunotal-auth
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - SESSION_SECRET=sunotal-super-secret-session-key
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  operations-service:
    build:
      context: ./services/operations-service
      dockerfile: Dockerfile
    container_name: sunotal-operations
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - SESSION_SECRET=sunotal-super-secret-session-key
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5002/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: sunotal-inventory
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - SESSION_SECRET=sunotal-super-secret-session-key
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5003/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: sunotal-user
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - SESSION_SECRET=sunotal-super-secret-session-key
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5004/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    container_name: sunotal-delivery
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - SESSION_SECRET=sunotal-super-secret-session-key
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5006/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  support-service:
    build:
      context: ./services/support-service
      dockerfile: Dockerfile
    container_name: sunotal-support
    restart: unless-stopped
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - SESSION_SECRET=sunotal-super-secret-session-key
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5007/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  user-app:
    build:
      context: ./apps/user-app
      dockerfile: Dockerfile
    container_name: sunotal-user-app
    restart: unless-stopped
    ports:
      - "3000:80"

  admin-app:
    build:
      context: ./apps/admin-app
      dockerfile: Dockerfile
    container_name: sunotal-admin-app
    restart: unless-stopped
    ports:
      - "3001:80"

  vendor-app:
    build:
      context: ./apps/vendor-app
      dockerfile: Dockerfile
    container_name: sunotal-vendor-app
    restart: unless-stopped
    ports:
      - "3002:80"

  delivery-app:
    build:
      context: ./apps/delivery-app
      dockerfile: Dockerfile
    container_name: sunotal-delivery-app
    restart: unless-stopped
    ports:
      - "3003:80"

  support-app:
    build:
      context: ./apps/support-app
      dockerfile: Dockerfile
    container_name: sunotal-support-app
    restart: unless-stopped
    ports:
      - "3004:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: sunotal-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sunotal_promdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: sunotal-grafana
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - sunotal_grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  sunotal_mongodata:
  sunotal_promdata:
  sunotal_grafanadata:

