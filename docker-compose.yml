services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sunotal-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sunotal
      POSTGRES_PASSWORD: sunotal_pass_dev
      POSTGRES_DB: sunotal
    volumes:
      - sunotal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunotal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sunotal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - sunotal_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  mongodb:
    image: mongo:7.0
    container_name: sunotal-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sunotal_mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── 6 Core Micro-Service Backends ────────────────────────────────────────
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: sunotal-gateway-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://sunotal:sunotal_pass_dev@postgres:5432/sunotal
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/sunotal}
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-jcs-raju-sunotal-final}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - VITE_RAZORPAY_KEY_ID=${VITE_RAZORPAY_KEY_ID:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
      - VITE_FIREBASE_VAPID_KEY=${VITE_FIREBASE_VAPID_KEY:-}
    networks:
      default:
        aliases:
          - gateway-service
          - sunotal-gateway-service
          - sunotal-gateway-service.sunotal.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  public-service-backend:
    build:
      context: ./public-service/backend
      dockerfile: Dockerfile
    container_name: sunotal-public-backend
    restart: unless-stopped
    ports:
      - "5009:5009"
    environment:
      - PORT=5009
      - DATABASE_URL=postgresql://sunotal:sunotal_pass_dev@postgres:5432/sunotal
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5009/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin-service-backend:
    build:
      context: ./admin-service/backend
      dockerfile: Dockerfile
    container_name: sunotal-admin-backend
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - DATABASE_URL=postgresql://sunotal:sunotal_pass_dev@postgres:5432/sunotal
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-jcs-raju-sunotal-final}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5002/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  vendor-service-backend:
    build:
      context: ./vendor-service/backend
      dockerfile: Dockerfile
    container_name: sunotal-vendor-backend
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - DATABASE_URL=postgresql://sunotal:sunotal_pass_dev@postgres:5432/sunotal
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5005/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  delivery-service-backend:
    build:
      context: ./delivery-service/backend
      dockerfile: Dockerfile
    container_name: sunotal-delivery-backend
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - DATABASE_URL=postgresql://sunotal:sunotal_pass_dev@postgres:5432/sunotal
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5004/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  support-monitoring-backend:
    build:
      context: ./support-monitoring-service/backend
      dockerfile: Dockerfile
    container_name: sunotal-support-monitoring-backend
    restart: unless-stopped
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - DATABASE_URL=postgresql://sunotal:sunotal_pass_dev@postgres:5432/sunotal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5007/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── 5 Domain Application Frontends ──────────────────────────────────────
  # Public Domain: sunotal.automateuniverse.space
  public-service-frontend:
    build:
      context: ./public-service/frontend
      dockerfile: Dockerfile
    container_name: sunotal-public-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Admin Domain: admin-sunotal.automateuniverse.space
  admin-service-frontend:
    build:
      context: ./admin-service/frontend
      dockerfile: Dockerfile
    container_name: sunotal-admin-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Vendor Domain: vendor-sunotal.automateuniverse.space
  vendor-service-frontend:
    build:
      context: ./vendor-service/frontend
      dockerfile: Dockerfile
    container_name: sunotal-vendor-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Delivery Domain: delivery-sunotal.automateuniverse.space
  delivery-service-frontend:
    build:
      context: ./delivery-service/frontend
      dockerfile: Dockerfile
    container_name: sunotal-delivery-frontend
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Support & Monitoring Domains
  support-service-frontend:
    build:
      context: ./support-monitoring-service/frontend/support-app
      dockerfile: Dockerfile
    container_name: sunotal-support-frontend
    restart: unless-stopped
    ports:
      - "3004:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  monitoring-service-frontend:
    build:
      context: ./support-monitoring-service/frontend/monitoring-app
      dockerfile: Dockerfile
    container_name: sunotal-monitoring-frontend
    restart: unless-stopped
    ports:
      - "3006:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  mobile-customer-app:
    build:
      context: ./mobile/packages/customer-app
      dockerfile: Dockerfile
    container_name: sunotal-customer-mobile
    restart: unless-stopped
    ports:
      - "3007:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  mobile-rider-app:
    build:
      context: ./mobile/packages/rider-app
      dockerfile: Dockerfile
    container_name: sunotal-rider-mobile
    restart: unless-stopped
    ports:
      - "3008:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  mobile-vendor-app:
    build:
      context: ./mobile/packages/vendor-app
      dockerfile: Dockerfile
    container_name: sunotal-vendor-mobile
    restart: unless-stopped
    ports:
      - "3009:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Nginx Subdomain Router (Port 80 for ALB Routing) ─────────────────────
  nginx-router:
    image: nginx:alpine
    container_name: sunotal-nginx-router
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      public-service-frontend:
        condition: service_healthy
      admin-service-frontend:
        condition: service_healthy
      vendor-service-frontend:
        condition: service_healthy
      delivery-service-frontend:
        condition: service_healthy
      support-service-frontend:
        condition: service_healthy
      monitoring-service-frontend:
        condition: service_healthy
      mobile-customer-app:
        condition: service_healthy
      mobile-rider-app:
        condition: service_healthy
      mobile-vendor-app:
        condition: service_healthy

volumes:
  sunotal_pgdata:
  sunotal_redisdata:
  sunotal_mongodata:
