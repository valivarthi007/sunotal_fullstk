---
- name: "Ansible Target Compilation & Type-Check"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_path: "{{ target_path }}"

  tasks:
    - name: "Install dependencies in target directory"
      command:
        cmd: "pnpm install --no-frozen-lockfile || npm install"
        chdir: "{{ target_path }}"

    - name: "TypeScript Type Check target"
      command:
        cmd: "npx tsc --noEmit"
        chdir: "{{ target_path }}"
      ignore_errors: true

    - name: "Build target artifacts"
      command:
        cmd: "npm run build || pnpm build"
        chdir: "{{ target_path }}"
