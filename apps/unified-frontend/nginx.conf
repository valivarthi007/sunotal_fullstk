events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip compression — critical for JS/CSS delivery performance
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_buffers    16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ─── 1. Primary Default Server (Supports Subdomains & IP Path Access) ─────
    server {
        listen 80 default_server;
        server_name sunotal.automateuniverse.space localhost _ "";

        root /usr/share/nginx/html/user-app;

        # Health check endpoint (fast — no disk I/O)
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Global Vite hashed assets — checks all 5 app dist directories
        location /assets/ {
            include /etc/nginx/mime.types;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;
            try_files $uri /usr/share/nginx/html/user-app$uri /usr/share/nginx/html/admin-app$uri /usr/share/nginx/html/vendor-app$uri /usr/share/nginx/html/delivery-app$uri /usr/share/nginx/html/support-app$uri =404;
        }

        # Path-based routing for IP access
        location /admin/ {
            alias /usr/share/nginx/html/admin-app/;
            try_files $uri $uri/ /usr/share/nginx/html/admin-app/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /vendor/ {
            alias /usr/share/nginx/html/vendor-app/;
            try_files $uri $uri/ /usr/share/nginx/html/vendor-app/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /delivery/ {
            alias /usr/share/nginx/html/delivery-app/;
            try_files $uri $uri/ /usr/share/nginx/html/delivery-app/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /support/ {
            alias /usr/share/nginx/html/support-app/;
            try_files $uri $uri/ /usr/share/nginx/html/support-app/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Default SPA catch-all (user-app)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /api/ {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
        }
    }

    # ─── 2. Farmer & Vendor Portal Subdomain ─────────────────────────────────
    server {
        listen 80;
        server_name vendor-sunotal.automateuniverse.space farmer-sunotal.automateuniverse.space;

        root /usr/share/nginx/html/vendor-app;

        location /assets/ {
            include /etc/nginx/mime.types;
