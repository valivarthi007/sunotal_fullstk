---
- name: "Build Container Images & Push to AWS ECR"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"
    git_sha: "{{ lookup('env', 'GITHUB_SHA') | default('latest', true) }}"

  tasks:
    - name: Get AWS Account ID
      command: aws sts get-caller-identity --query Account --output text
      register: aws_account_id
      failed_when: false

    - name: Set ECR Registry Variable
      set_fact:
        ecr_registry: "{{ aws_account_id.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com"
      when: aws_account_id.stdout != ""

    - name: Log in to AWS ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_registry }}
      when: aws_account_id.stdout != ""

    - name: Find backend microservices
      find:
        paths: "services"
        file_type: directory
        recurse: false
      register: backend_dirs

    - name: Build & Push Backend Microservices Docker Images
      shell: |
        SERVICE_NAME=$(basename "{{ item.path }}")
        REPO_NAME="sunotal-${SERVICE_NAME}"
        docker build -t "${REPO_NAME}:latest" -t "${REPO_NAME}:{{ git_sha }}" "{{ item.path }}"
        if [ -n "{{ aws_account_id.stdout }}" ]; then
          aws ecr create-repository --repository-name "$REPO_NAME" 2>/dev/null || true
          docker tag "${REPO_NAME}:latest" "{{ ecr_registry }}/${REPO_NAME}:latest"
          docker tag "${REPO_NAME}:{{ git_sha }}" "{{ ecr_registry }}/${REPO_NAME}:{{ git_sha }}"
          docker push "{{ ecr_registry }}/${REPO_NAME}:latest"
          docker push "{{ ecr_registry }}/${REPO_NAME}:{{ git_sha }}"
        fi
      loop: "{{ backend_dirs.files }}"

    - name: Find frontend apps
      find:
        paths: "apps"
        file_type: directory
        recurse: false
      register: frontend_dirs

    - name: Build & Push Frontend Applications Docker Images
      shell: |
        APP_NAME=$(basename "{{ item.path }}")
        REPO_NAME="sunotal-${APP_NAME}"
        docker build -t "${REPO_NAME}:latest" -t "${REPO_NAME}:{{ git_sha }}" "{{ item.path }}"
        if [ -n "{{ aws_account_id.stdout }}" ]; then
          aws ecr create-repository --repository-name "$REPO_NAME" 2>/dev/null || true
          docker tag "${REPO_NAME}:latest" "{{ ecr_registry }}/${REPO_NAME}:latest"
          docker tag "${REPO_NAME}:{{ git_sha }}" "{{ ecr_registry }}/${REPO_NAME}:{{ git_sha }}"
          docker push "{{ ecr_registry }}/${REPO_NAME}:latest"
          docker push "{{ ecr_registry }}/${REPO_NAME}:{{ git_sha }}"
        fi
      loop: "{{ frontend_dirs.files }}"
