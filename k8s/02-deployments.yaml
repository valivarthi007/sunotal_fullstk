apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunotal-frontend
  namespace: sunotal
  labels:
    app: sunotal-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sunotal-frontend
  template:
    metadata:
      labels:
        app: sunotal-frontend
    spec:
      containers:
        - name: frontend
          image: sunotal-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunotal-auth
  namespace: sunotal
  labels:
    app: sunotal-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sunotal-auth
  template:
    metadata:
      labels:
        app: sunotal-auth
    spec:
      containers:
        - name: auth
          image: sunotal-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
          envFrom:
            - configMapRef:
                name: sunotal-config
            - secretRef:
                name: sunotal-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
---
