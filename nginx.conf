events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 20M;

    sendfile on;
    keepalive_timeout 65;

    # 1. Customer Grocery Storefront (sunotal.automateuniverse.space & default fallback)
    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        server_name sunotal.automateuniverse.space localhost "";

        if ($scheme = "http") {
            return 301 https://$host$request_uri;
        }

        location / {
            proxy_pass http://sunotal-user-app:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            proxy_pass http://sunotal-auth:5001;
            proxy_set_header Host $host;
        }

        location /api/delivery/ {
            proxy_pass http://sunotal-delivery:5006;
            proxy_set_header Host $host;
        }

        location /api/support/ {
            proxy_pass http://sunotal-support:5007;
            proxy_set_header Host $host;
        }

        location /api/inventory/ {
            proxy_pass http://sunotal-inventory:5003;
            proxy_set_header Host $host;
        }

        location /api/users/ {
            proxy_pass http://sunotal-user:5004;
            proxy_set_header Host $host;
        }

        location /api/users {
            proxy_pass http://sunotal-user:5004;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://sunotal-operations:5002;
            proxy_set_header Host $host;
        }
    }

