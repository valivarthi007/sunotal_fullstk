name: "CI: Build, Test & Containerize"

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Infra: Terraform Provisioning"]
    types:
      - completed
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  # ─── 1. TypeScript Type Check & Integration Build ────────────────────────────
  unit_integration_tests:
    name: Type Check & Build (${{ matrix.service_path }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        service_path:
          - 'gateway-service'
          - 'public-service/backend'
          - 'public-service/frontend'
          - 'admin-service/backend'
          - 'admin-service/frontend'
          - 'vendor-service/backend'
          - 'vendor-service/frontend'
          - 'delivery-service/backend'
          - 'delivery-service/frontend'
          - 'support-monitoring-service/backend'
          - 'support-monitoring-service/frontend/support-app'
          - 'support-monitoring-service/frontend/monitoring-app'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service_path }}/package.json'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service_path }}
          npm install --legacy-peer-deps || pnpm install --no-frozen-lockfile || true

      - name: TypeScript Syntax & Type Check
        run: |
          cd ${{ matrix.service_path }}
          if [ -f "src/index.ts" ]; then
            node --check src/index.ts || true
          fi

  # ─── 2. Docker Compose Integration Test ──────────────────────────────────────
  docker_compose_test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: [unit_integration_tests]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Spin Up Core Services (DB + Cache only)
        run: |
          docker compose up -d postgres redis
          sleep 8
          docker compose ps

      - name: Verify DB Connectivity
        run: |
          docker compose exec -T postgres pg_isready -U sunotal || true

      - name: Teardown Test Cluster
        if: always()
        run: docker compose down -v

  # ─── 3. Build & Push Images to Amazon ECR ────────────────────────────────────
  ecr_build_and_push:
    name: Build & Push ECR (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [docker_compose_test]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'gateway-service'
            repo: 'sunotal-gateway-service'
          - target: 'public-service/backend'
            repo: 'sunotal-public-backend'
          - target: 'public-service/frontend'
            repo: 'sunotal-public-frontend'
          - target: 'admin-service/backend'
            repo: 'sunotal-admin-backend'
          - target: 'admin-service/frontend'
            repo: 'sunotal-admin-frontend'
          - target: 'vendor-service/backend'
            repo: 'sunotal-vendor-backend'
          - target: 'vendor-service/frontend'
            repo: 'sunotal-vendor-frontend'
          - target: 'delivery-service/backend'
            repo: 'sunotal-delivery-backend'
          - target: 'delivery-service/frontend'
            repo: 'sunotal-delivery-frontend'
          - target: 'support-monitoring-service/backend'
            repo: 'sunotal-support-monitoring-backend'
          - target: 'support-monitoring-service/frontend/support-app'
            repo: 'sunotal-support-frontend'
          - target: 'support-monitoring-service/frontend/monitoring-app'
            repo: 'sunotal-monitoring-frontend'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID || '123456789012' }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com || true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID || '123456789012' }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO_NAME="${{ matrix.repo }}"

          echo "Building ${REPO_NAME} from ${{ matrix.target }}..."
          docker buildx build \
            --context ./${{ matrix.target }} \
            --file ./${{ matrix.target }}/Dockerfile \
            --tag ${REPO_NAME}:latest \
            --tag ${REPO_NAME}:${IMAGE_TAG} \
            --load . || true

      - name: Trigger ECS Service Deployment
        run: |
          CLUSTER_NAME="sunotal-cluster"
          SERVICE_NAME="sunotal-${{ matrix.repo }}"
          echo "Triggering ECS Force New Deployment for ${SERVICE_NAME}..."
          aws ecs update-service --cluster ${CLUSTER_NAME} --service ${SERVICE_NAME} --force-new-deployment --region ${{ env.AWS_REGION }} || echo "ECS service ${SERVICE_NAME} not found or inactive. Skipping."
