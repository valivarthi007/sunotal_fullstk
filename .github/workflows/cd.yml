name: CD Pipeline

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target Compute Platform (auto, eks, or ecs)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - eks
          - ecs

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  deploy:
    name: Deploy Application
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
        continue-on-error: true

      - name: Auto-Detect Active Deployment Target
        id: set_target
        run: |
          TARGET="${{ inputs.deploy_target }}"
          
          if [ -z "$TARGET" ] || [ "$TARGET" = "auto" ]; then
            echo "Attempting auto-detection of active compute target from SSM..."
            TARGET=$(aws ssm get-parameter --name "/sunotal/compute_target" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          fi

          if [ -z "$TARGET" ] || [ "$TARGET" = "auto" ]; then
            echo "SSM parameter not found. Checking if EKS cluster 'sunotal-cluster' is ACTIVE..."
            EKS_STATUS=$(aws eks describe-cluster --name sunotal-cluster --query "cluster.status" --output text 2>/dev/null || echo "")
            if [ "$EKS_STATUS" = "ACTIVE" ]; then
              TARGET="eks"
            else
              TARGET="ecs"
            fi
          fi

          echo "DEPLOY_TARGET=$TARGET" >> $GITHUB_ENV
          echo "✅ Active Deployment Target set to: $TARGET"

      - name: Deploy to AWS EKS
        if: env.DEPLOY_TARGET == 'eks'
        run: |
          echo "🚀 Deploying to AWS EKS Cluster (sunotal-cluster)..."
          aws eks update-kubeconfig --name sunotal-cluster --region ${{ env.AWS_DEFAULT_REGION }} || true

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          if [ -n "$ACCOUNT_ID" ]; then
            ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
            echo "Substituting ECR registry: $ECR_REGISTRY"
            for app in sunotal-auth sunotal-operations sunotal-inventory sunotal-user sunotal-delivery sunotal-support sunotal-user-app sunotal-admin-app sunotal-vendor-app sunotal-delivery-app sunotal-support-app; do
              sed -i "s|${app}:latest|${ECR_REGISTRY}/${app}:latest|g" k8s/02-deployments.yaml
            done
          fi

          echo "Applying Kubernetes Namespace, ConfigMaps, and Services..."
          kubectl apply -f k8s/00-namespace.yaml || true
          kubectl apply -f k8s/01-configmap-secret.yaml || true
          kubectl apply -f k8s/03-services.yaml || true
          kubectl apply -f k8s/04-ingress.yaml || true

          echo "Applying Application Deployments..."
          kubectl apply -f k8s/02-deployments.yaml || true
          for dep in sunotal-user-app sunotal-admin-app sunotal-vendor-app sunotal-delivery-app sunotal-support-app sunotal-auth sunotal-operations sunotal-inventory sunotal-user sunotal-delivery sunotal-support; do
            kubectl rollout status deployment/$dep -n sunotal --timeout=180s || true
          done

          echo "Inspecting EKS Pod Statuses & Diagnostics..."
          kubectl get pods -n sunotal -o wide || true

          echo "Configuring Security Groups and Target Groups on AWS..."
          ALB_SG=$(aws elbv2 describe-load-balancers --names "sunotal-alb" --query "LoadBalancers[0].SecurityGroups[0]" --output text 2>/dev/null || echo "")
          EKS_SG=$(aws eks describe-cluster --name sunotal-cluster --query "cluster.resourcesVpcConfig.clusterSecurityGroupId" --output text 2>/dev/null || echo "")
          
          if [ -n "$ALB_SG" ] && [ -n "$EKS_SG" ]; then
            aws ec2 authorize-security-group-ingress --group-id "$EKS_SG" --protocol -1 --source-group "$ALB_SG" 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Deploy to AWS ECS Fargate
        if: env.DEPLOY_TARGET == 'ecs'
        run: |
          echo "Checking if ECS cluster 'sunotal-cluster' exists..."
          CLUSTER_STATE=$(aws ecs describe-clusters --clusters sunotal-cluster --query "clusters[0].status" --output text 2>/dev/null || echo "MISSING")

          if [ "$CLUSTER_STATE" != "ACTIVE" ]; then
            echo "❌ Error: ECS Cluster 'sunotal-cluster' is $CLUSTER_STATE."
            echo "👉 You MUST run the 'Infrastructure Automation' workflow (infra.yml) first to provision the ECS cluster, database, target groups, and task definitions via Terraform."
            exit 1
          fi

          echo "Fetching active ECS service names in cluster..."
          ACTIVE_SERVICES=$(aws ecs list-services --cluster sunotal-cluster --query "serviceArns[*]" --output text 2>/dev/null | tr '\t' '\n' | xargs -n1 basename 2>/dev/null || echo "")

          if [ -z "$ACTIVE_SERVICES" ]; then
            echo "⚠️ No active ECS services found in cluster sunotal-cluster."
            echo "👉 Please run the 'Infrastructure Automation' workflow (infra.yml) to provision the ECS cluster and services via Terraform."
          else
            echo "Updating existing ECS Services..."
            for svc in $ACTIVE_SERVICES; do
              echo "Updating service: $svc"
              aws ecs update-service --cluster sunotal-cluster --service "$svc" --force-new-deployment || true
            done

            echo "Waiting for services to reach stable state (in batches of max 8)..."
            echo "$ACTIVE_SERVICES" | xargs -n 8 | while read -r batch; do
              if [ -n "$batch" ]; then
                echo "Waiting for batch: $batch"
                aws ecs wait services-stable --cluster sunotal-cluster --services $batch || true
              fi
            done
          fi
        continue-on-error: true

      - name: Post-Deployment Automated Test Suite
        run: |
          BASE="https://sunotal.automateuniverse.space"
          echo "🧪 Running Post-Deployment Test Suite against $BASE..."

          # Warm-up / Target Group Health Check Readiness Loop
          echo "⏳ Waiting for ALB targets to register and return HTTP 200 (up to 120s)..."
          for i in {1..24}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$BASE/" || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Target group is healthy and returning HTTP 200!"
              break
            fi
            echo "Warming up container deployment... Attempt $i/24 (HTTP $STATUS)"
            sleep 5
          done

          # Test 1: Customer Frontend Webpage
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE/" || echo 000)
          echo "Test 1 [Customer Storefront]: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then echo "❌ Customer storefront test failed"; exit 1; fi

          # Test 2: Auth Service Healthz
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 5 --retry-delay 5 "$BASE/api/healthz" || echo 000)
          echo "Test 2 [Auth Service Healthz]: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then echo "❌ Healthz test failed"; exit 1; fi

          # Test 3: Admin Login & JWT Token
          LOGIN_RES=$(curl -s -X POST "$BASE/api/auth/login" -H "Content-Type: application/json" -d '{"email":"admin@sunotal.com","password":"admin123"}' || echo "")
          TOKEN=$(echo "$LOGIN_RES" | grep -o '"token":"[^"]*' | cut -d'"' -f4 || echo "")
          if [ -n "$TOKEN" ]; then
            echo "Test 3 [Admin Login API]: HTTP 200 (Token obtained successfully)"
          else
            echo "❌ Admin Login test failed. Response: $LOGIN_RES"
            exit 1
          fi

          # Test 4: Admin Dashboard Stats API
          STATS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$BASE/api/admin/stats" || echo 000)
          echo "Test 4 [Admin Stats API]: HTTP $STATS_STATUS"
          if [ "$STATS_STATUS" != "200" ]; then echo "❌ Admin stats test failed"; exit 1; fi

          # Test 5: Admin Quotations API
          QUOTES_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$BASE/api/admin/quotations" || echo 000)
          echo "Test 5 [Admin Quotations API]: HTTP $QUOTES_STATUS"
          if [ "$QUOTES_STATUS" != "200" ]; then echo "❌ Admin quotations test failed"; exit 1; fi

          echo "🎉 All 5 Post-Deployment Tests Passed Successfully! Microservices deployment is live and error-free."
        continue-on-error: false
