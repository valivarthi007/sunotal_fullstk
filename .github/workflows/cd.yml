name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4

jobs:
  deploy:
    name: Deploy & Release to ECS Fargate
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Deploy to ECS Fargate
        run: |
          echo "Updating ECS Services to pull latest images..."
          aws ecs update-service --cluster sunotal-cluster --service sunotal-frontend --force-new-deployment
          aws ecs update-service --cluster sunotal-cluster --service sunotal-auth --force-new-deployment
          aws ecs update-service --cluster sunotal-cluster --service sunotal-operations --force-new-deployment
          aws ecs update-service --cluster sunotal-cluster --service sunotal-inventory --force-new-deployment
          aws ecs update-service --cluster sunotal-cluster --service sunotal-user --force-new-deployment

      - name: Run Database Migrations & Seeds on ECS Fargate
        run: |
          # Fetch Subnet and Security Group for running task
          SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=sunotal-vpc-private-subnet-1" --query "Subnets[0].SubnetId" --output text)
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=sunotal-ecs-sg" --query "SecurityGroups[0].GroupId" --output text)
          
          if [ -n "$SUBNET_ID" ] && [ "$SUBNET_ID" != "None" ] && [ -n "$SECURITY_GROUP_ID" ] && [ "$SECURITY_GROUP_ID" != "None" ]; then
            echo "Running one-off task for DB Push..."
            aws ecs run-task \
              --cluster sunotal-cluster \
              --task-definition sunotal-auth \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=ENABLED}" \
              --overrides '{"containerOverrides": [{"name": "auth", "command": ["pnpm", "run", "db:push"]}]}'
            
            echo "Running one-off task for DB Seed..."
            aws ecs run-task \
              --cluster sunotal-cluster \
              --task-definition sunotal-auth \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=ENABLED}" \
              --overrides '{"containerOverrides": [{"name": "auth", "command": ["pnpm", "run", "db:seed"]}]}'
          else
            echo "Warning: Could not fetch Subnet ID or Security Group ID for running DB migration task."
          fi

      - name: Wait for ECS Services Rollout
        run: |
          echo "Waiting for services to become stable..."
          aws ecs wait services-stable --cluster sunotal-cluster --services sunotal-frontend sunotal-auth sunotal-operations sunotal-inventory sunotal-user

      - name: Strict HTTP Health Check
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "sunotal-alb" --query "LoadBalancers[0].DNSName" --output text)
          if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ]; then
            echo "Running strict health checks against ALB..."
            # Check Frontend
            curl --fail --retry 3 --retry-delay 5 "http://$ALB_DNS/"
            # Check Auth Service Health
            curl --fail --retry 3 --retry-delay 5 "http://$ALB_DNS/api/auth/healthz"
            # Check Operations Service & DB connection
            curl --fail --retry 3 --retry-delay 5 "http://$ALB_DNS/api/products"
            # Check Inventory Service & DB connection
            curl --fail --retry 3 --retry-delay 5 "http://$ALB_DNS/api/inventory"
            echo "✅ All services, database connections, and API endpoints are healthy and running!"
          else
            echo "Error: Could not retrieve ALB DNS Name."
            exit 1
          fi
