services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: sunotal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sunotal_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: sunotal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - sunotal_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ─── Nginx Gateway ────────────────────────────────────────────────────────
  gateway:
    image: nginx:1.25-alpine
    container_name: sunotal-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      user-app:
        condition: service_healthy
      admin-app:
        condition: service_healthy
      vendor-app:
        condition: service_healthy
      delivery-app:
        condition: service_healthy
      support-app:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      operations-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      vendor-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      support-service:
        condition: service_healthy

  # ─── Backend Microservices ────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: sunotal-auth
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  operations-service:
    build:
      context: ./services/operations-service
      dockerfile: Dockerfile
    container_name: sunotal-operations
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-sunotal-jwt-secret-dev}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5002/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: sunotal-inventory
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5003/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: sunotal-user
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5004/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  vendor-service:
    build:
      context: ./services/vendor-service
      dockerfile: Dockerfile
    container_name: sunotal-vendor
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5005/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    container_name: sunotal-delivery
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5006/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  support-service:
    build:
      context: ./services/support-service
      dockerfile: Dockerfile
    container_name: sunotal-support
    restart: unless-stopped
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - MONGODB_URI=mongodb://mongodb:27017/sunotal
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5007/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Frontend Apps ────────────────────────────────────────────────────────
  user-app:
    build:
      context: ./apps/user-app
      dockerfile: Dockerfile
    container_name: sunotal-user-app
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin-app:
    build:
      context: ./apps/admin-app
      dockerfile: Dockerfile
    container_name: sunotal-admin-app
    restart: unless-stopped
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  vendor-app:
    build:
      context: ./apps/vendor-app
      dockerfile: Dockerfile
    container_name: sunotal-vendor-app
    restart: unless-stopped
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  delivery-app:
    build:
      context: ./apps/delivery-app
      dockerfile: Dockerfile
    container_name: sunotal-delivery-app
    restart: unless-stopped
    ports:
      - "3003:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  support-app:
    build:
      context: ./apps/support-app
      dockerfile: Dockerfile
    container_name: sunotal-support-app
    restart: unless-stopped
    ports:
      - "3004:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Observability ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sunotal-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sunotal_promdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: sunotal-grafana
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - sunotal_grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sunotal_mongodata:
  sunotal_redisdata:
  sunotal_promdata:
  sunotal_grafanadata:
