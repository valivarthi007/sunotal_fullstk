server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Proxy API calls to API Gateway (prevents HTTP 405 Not Allowed on POST requests)
    location /api/ {
        proxy_pass https://api.automateuniverse.space/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.automateuniverse.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
