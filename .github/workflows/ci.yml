name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  backend_microservices_ci:
    name: Microservices Build & Health Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Microservices
        run: |
          echo "📦 Installing and compiling backend microservices..."
          for service in services/*; do
            if [ -d "$service" ] && [ -f "$service/package.json" ]; then
              echo "⚙️ Building $service..."
              cd "$service"
              npm ci || npm install
              npm run build || npx tsc
              cd ../..
            fi
          done

      - name: Start Microservices Cluster
        run: |
          echo "🚀 Starting backend microservices cluster on background processes..."
          node scripts/start-microservices.js &
          sleep 5

      - name: Run E2E System Health Integration Tests
        run: |
          echo "🧪 Running Sunotal E2E integration test suite..."
          node scripts/test-platform-health.js

  frontend_apps_ci:
    name: Frontend Applications Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend Applications
        run: |
          echo "📦 Compiling and building frontend applications..."
          for app in apps/*; do
            if [ -d "$app" ] && [ -f "$app/package.json" ]; then
              echo "🎨 Building $app..."
              cd "$app"
              npm ci || npm install
              npm run build || npx tsc --noEmit
              cd ../..
            fi
          done

  terraform_ci:
    name: Terraform Lint & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Terraform Format & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate
