name: Infrastructure Automation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - 'packer/**'
      - '.github/workflows/infra.yml'

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  validate_and_deploy:
    name: Provision Infrastructure & AMI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "latest"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.3"

      - name: Validate Packer Template
        run: |
          cd packer
          packer init .
          packer validate .

      - name: Validate Terraform Files
        run: |
          cd terraform
          terraform fmt -check || true
          terraform init -backend=false -upgrade
          terraform validate

      - name: Build AMI with Packer
        id: packer_build
        run: |
          cd packer
          packer build -var="aws_region=${{ env.AWS_REGION }}" .
          MANIFEST_PATH="$GITHUB_WORKSPACE/packer/packer-manifest.json"
          
          if [ -f "$MANIFEST_PATH" ]; then
            AMI_ID=$(grep -o '"artifact_id": *"[^"]*"' "$MANIFEST_PATH" | tail -n1 | cut -d '"' -f4 | cut -d ':' -f2)
            echo "Successfully built AMI ID: $AMI_ID"
            echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          else
            echo "::error::packer-manifest.json not found at $MANIFEST_PATH"
            exit 1
          fi

      - name: Deploy Infrastructure with Terraform
        env:
          TF_VAR_ami_id: ${{ steps.packer_build.outputs.ami_id }}
          RAW_PEM_KEY: "${{ secrets.EC2_SSH_KEY }}"
        run: |
          mkdir -p ~/.ssh
          echo "$RAW_PEM_KEY" > ~/.ssh/id_rsa
          tr -d '\r' < ~/.ssh/id_rsa > ~/.ssh/id_rsa.clean
          mv ~/.ssh/id_rsa.clean ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PUB_KEY=$(ssh-keygen -y -f ~/.ssh/id_rsa)
          echo "::add-mask::$PUB_KEY"
          
          cd terraform
          terraform init -upgrade
          echo "Planning Terraform Deployment for AMI: $TF_VAR_ami_id..."
          terraform plan -var="ami_id=${TF_VAR_ami_id}" -var="public_key=${PUB_KEY}"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Applying Infrastructure Changes..."
            terraform apply -auto-approve -var="ami_id=${TF_VAR_ami_id}" -var="public_key=${PUB_KEY}"
          else
            echo "PR Validation complete — terraform apply skipped for non-dispatch/PR builds."
          fi

