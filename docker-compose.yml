version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sunotal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunotal
      POSTGRES_USER: sunotal
      POSTGRES_PASSWORD: sunotalpass123
    ports:
      - "5432:5432"
    volumes:
      - sunotal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunotal -d sunotal"]
      interval: 10s
      timeout: 5s
      retries: 5

  delivery-service:
    build:
      context: ./backend/services/delivery-service
      dockerfile: Dockerfile
    container_name: sunotal-delivery
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - DATABASE_URL=postgresql://sunotal:sunotalpass123@postgres:5432/sunotal
      - SESSION_SECRET=sunotal-super-secret-session-key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5006/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: sunotal-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sunotal_promdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: sunotal-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - sunotal_grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  sunotal_pgdata:
  sunotal_promdata:
  sunotal_grafanadata:
