server {
    listen 80;
    server_name localhost;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;

    # Gzip for JS/CSS — browsers require correct content-encoding
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # Health check — instant 200, no disk I/O
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # DNS Resolver for fast AWS ALB lookup without block/stall
    resolver 10.10.0.2 8.8.8.8 valid=30s ipv6=off;

    # Proxy API calls to API Gateway with keep-alive connection pooling
    location /api/ {
        proxy_pass https://api.automateuniverse.space/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.automateuniverse.space;
        proxy_set_header Host api.automateuniverse.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }


    # Vite hashed assets — cache 1 year, serve directly (404 if missing)
    location /assets/ {
        include /etc/nginx/mime.types;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # SPA catch-all — no-cache on index.html so deploys are picked up immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
