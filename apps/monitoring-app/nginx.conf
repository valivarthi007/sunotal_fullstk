server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # DNS Resolver for fast AWS ALB lookup without block/stall
    resolver 10.10.0.2 8.8.8.8 valid=30s ipv6=off;

    # Proxy API calls to API Gateway (prevents HTTP 405 Not Allowed on POST requests)
    location /api/ {
        proxy_pass https://api.automateuniverse.space/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.automateuniverse.space;
        proxy_set_header Host api.automateuniverse.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
