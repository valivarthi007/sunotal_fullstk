name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4
  
  # Database Configuration (Overrides via GitHub Secrets)
  DB_IDENTIFIER: ${{ secrets.DB_IDENTIFIER || 'sunotal-postgres' }}
  DB_USER: ${{ secrets.DB_USER || 'sunotal' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'sunotalpass123' }}
  DB_NAME: ${{ secrets.DB_NAME || 'sunotal' }}

jobs:
  deploy:
    name: Package, Version, Upload & Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../backend && pnpm install --frozen-lockfile

      - name: Build applications
        run: |
          cd frontend && pnpm build
          cd ../backend && pnpm build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push ECR images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/sunotal-frontend:$IMAGE_TAG ./frontend
          docker build -t $ECR_REGISTRY/sunotal-auth:$IMAGE_TAG ./backend/services/auth-service
          docker build -t $ECR_REGISTRY/sunotal-operations:$IMAGE_TAG ./backend/services/operations-service
          docker build -t $ECR_REGISTRY/sunotal-inventory:$IMAGE_TAG ./backend/services/inventory-service
          docker build -t $ECR_REGISTRY/sunotal-user:$IMAGE_TAG ./backend/services/user-service
          
          docker push $ECR_REGISTRY/sunotal-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-auth:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-operations:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-inventory:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-user:$IMAGE_TAG

      - name: Deploy to Private EC2 via SSH through Bastion Host
        env:
          RAW_PEM_KEY: "${{ secrets.EC2_SSH_KEY }}"
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$RAW_PEM_KEY" > ~/.ssh/id_rsa
          tr -d '\r' < ~/.ssh/id_rsa > ~/.ssh/id_rsa.clean
          mv ~/.ssh/id_rsa.clean ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          BASTION_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sunotal-bastion" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          PRIVATE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sunotal-frontend" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)

          DB_IDENTIFIER="${{ env.DB_IDENTIFIER }}"
          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_IDENTIFIER" \
            --query "DBInstances[0].Endpoint.Address" --output text || echo "")

          CLOUDFRONT_DOMAIN=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='CloudFront CDN for Sunotal S3 Product Assets'].DomainName" \
            --output text || echo "")

          if [ -z "$BASTION_IP" ] || [ "$BASTION_IP" = "None" ]; then
            echo "::error::Failed to find running Bastion host with tag Name=sunotal-bastion."
            exit 1
          fi

          if [ -z "$PRIVATE_IP" ] || [ "$PRIVATE_IP" = "None" ]; then
            echo "::error::Failed to find running Private EC2 instance with tag Name=sunotal-frontend."
            exit 1
          fi

          # Configure SSH Config for jump host (bastion)
          cat <<EOF > ~/.ssh/config
          Host bastion
            HostName ${BASTION_IP}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host app-private
            HostName ${PRIVATE_IP}
            User ubuntu
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          # Transfer docker-compose.prod.yml to the app host
          scp docker-compose.prod.yml app-private:/home/ubuntu/docker-compose.prod.yml

          echo "Executing Docker Compose deployment on Private EC2 instance..."
          ssh app-private bash -s <<REMOTE_SCRIPT
            set -e
            
            # Log in to ECR on remote EC2
            aws ecr get-login-password --region ${{ env.AWS_DEFAULT_REGION }} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
            
            # Create environment configuration
            cat <<EOF > .env
            ECR_REGISTRY=${ECR_REGISTRY}
            IMAGE_TAG=${IMAGE_TAG}
            DATABASE_URL=postgresql://${{ env.DB_USER }}:${{ env.DB_PASSWORD }}@${DB_HOST}:5432/${{ env.DB_NAME }}?sslmode=require&uselibpqcompat=true
            SESSION_SECRET=${{ secrets.SESSION_SECRET || 'sunotal-session-secret-corporate-prod' }}
            CLOUDFRONT_DOMAIN=https://${CLOUDFRONT_DOMAIN}
            FRONTEND_URL=http://localhost
            EOF

            # Run docker compose up
            docker compose -f docker-compose.prod.yml --env-file .env up -d --pull always
            
            # Wait for backend container to be healthy and run database migrations/seeds
            docker exec sunotal-auth pnpm run db:push || true
            docker exec sunotal-auth pnpm run db:seed || true

            # Prune unused docker objects to keep disk clean
            docker system prune -f
            
            echo "✅ Docker Compose deployment completed successfully on Private EC2!"
          REMOTE_SCRIPT

      - name: HTTP Health Check via ALB
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "sunotal-alb" --query "LoadBalancers[0].DNSName" --output text)
          if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ]; then
            echo "Running health check against ALB at http://$ALB_DNS..."
            curl --fail --retry 5 --retry-delay 5 http://$ALB_DNS/ || echo "Health check ping complete"
          fi
