name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4

jobs:
  sonartest:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  ci_verify:
    name: Install, Lint, Test & Build
    needs: sonartest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../backend && pnpm install --frozen-lockfile

      - name: Install Playwright Browsers (for E2E)
        run: |
          cd frontend && npx playwright install --with-deps chromium

      - name: Type check and lint
        run: |
          cd frontend && pnpm exec tsc --noEmit
          cd ../backend && pnpm exec tsc --noEmit

      - name: Run Backend Tests
        run: |
          cd backend && pnpm run test -- --reporter=json --outputFile=backend-report.json

      - name: Run Frontend Tests
        run: |
          cd frontend && pnpm run test -- --reporter=json --outputFile=frontend-report.json

      - name: Run Frontend E2E Tests
        run: |
          cd frontend && pnpm run test:e2e
        continue-on-error: true

      - name: Build applications
        run: |
          cd frontend && pnpm build
          cd ../backend && pnpm build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Publish Test Reports to S3
        if: always()
        run: |
          BUCKET_NAME="${{ env.S3_BUCKET_NAME }}"
          BUILD_TAG="${GITHUB_SHA::8}"
          
          echo "Publishing test reports to s3://${BUCKET_NAME}/test_reports/..."
          
          # Upload Backend JSON report
          if [ -f backend/backend-report.json ]; then
            aws s3 cp backend/backend-report.json s3://${BUCKET_NAME}/test_reports/${BUILD_TAG}/backend/backend-report.json
            aws s3 cp backend/backend-report.json s3://${BUCKET_NAME}/test_reports/latest/backend/backend-report.json
          fi
          
          # Upload Frontend JSON report
          if [ -f frontend/frontend-report.json ]; then
            aws s3 cp frontend/frontend-report.json s3://${BUCKET_NAME}/test_reports/${BUILD_TAG}/frontend/frontend-report.json
            aws s3 cp frontend/frontend-report.json s3://${BUCKET_NAME}/test_reports/latest/frontend/frontend-report.json
          fi
          
          # Upload Playwright E2E HTML reports
          if [ -d frontend/playwright-report ]; then
            aws s3 cp frontend/playwright-report/ s3://${BUCKET_NAME}/test_reports/${BUILD_TAG}/e2e/ --recursive
            aws s3 cp frontend/playwright-report/ s3://${BUCKET_NAME}/test_reports/latest/e2e/ --recursive
          fi