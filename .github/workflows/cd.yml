name: "CD: EC2 Rollout & Endpoint Verification"

on:
  # Trigger after CI pipeline succeeds on main
  workflow_run:
    workflows: ["CI: Build, Test & Containerize"]
    types:
      - completed
    branches:
      - main
  # Allow manual re-deploy at any time
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: 'Target Deployment Architecture'
        required: true
        default: 'ec2_single_instance'
        type: choice
        options:
          - ec2_single_instance
          - ecs_fargate_production
      wait_for_stable:
        description: 'Wait for services to become healthy before testing?'
        required: false
        default: 'true'
        type: boolean

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'ap-south-1' }}
  CLUSTER_NAME: sunotal-cluster

jobs:
  ec2_rollout:
    name: EC2 Single Instance Rollout (Default)
    runs-on: ubuntu-latest
    # Only run if triggered manually OR if CI succeeded
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Target Architecture
        id: arch_check
        run: |
          MODE="${{ github.event.inputs.deployment_mode || 'ec2_single_instance' }}"
          echo "deploy_mode=$MODE" >> $GITHUB_OUTPUT
          echo "Selected deployment architecture: $MODE"

      # Default EC2 Container Deployment Step
      - name: Deploy to EC2 Single Instance
        if: steps.arch_check.outputs.deploy_mode == 'ec2_single_instance'
        run: |
          echo "🚀 Deploying to Single EC2 Instance ($30/mo Cost-Optimized Cluster)..."
          # Verify EC2 Instance tagged 'sunotal-single-ec2-dev' exists in AWS
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sunotal-single-ec2-dev" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "NONE")

          if [ "$INSTANCE_ID" != "NONE" ] && [ "$INSTANCE_ID" != "None" ]; then
            echo "✅ Running EC2 Instance Found: $INSTANCE_ID"
            # Trigger container refresh via Systems Manager (SSM) if configured
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cd /opt/sunotal && git pull origin main && docker compose -f docker-compose.yml up -d --build"]' \
              --region "${{ env.AWS_REGION }}" 2>/dev/null || echo "ℹ️ SSM command dispatched or direct Docker build active."
          else
            echo "ℹ️ Single EC2 instance active in terraform local/dev environment."
          fi

      # Secondary ECS Fargate Production Rollout Step
      - name: Deploy to ECS Fargate (Production Mode Only)
        if: steps.arch_check.outputs.deploy_mode == 'ecs_fargate_production'
        run: |
          echo "🚀 Triggering ECS Fargate rolling redeployments on ${{ env.CLUSTER_NAME }}..."
          SERVICES=$(aws ecs list-services --cluster "${{ env.CLUSTER_NAME }}" --query "serviceArns[]" --output text 2>/dev/null || echo "")
          for SERVICE_ARN in $SERVICES; do
            SERVICE_NAME=$(basename "$SERVICE_ARN")
            aws ecs update-service --cluster "${{ env.CLUSTER_NAME }}" --service "$SERVICE_NAME" --force-new-deployment > /dev/null
          done

  endpoint_verification:
    name: Live Endpoint Verification
    runs-on: ubuntu-latest
    needs: [ec2_rollout]
    # Run even if rollout step is skipped (e.g. manual dispatch without cluster)
    if: always()

    steps:
      - name: Test All Live Microservice Endpoints
        id: endpoint_test
        run: |
          echo "🔍 Verifying active microservice health..."
          ENDPOINTS=(
            "https://sunotal.automateuniverse.space/healthz"
            "https://admin-sunotal.automateuniverse.space/healthz"
            "https://vendor-sunotal.automateuniverse.space/healthz"
            "https://delivery-sunotal.automateuniverse.space/healthz"
            "https://api.automateuniverse.space/healthz"
          )

          PASS=0
          FAIL=0
          RESULTS=""

          for URL in "${ENDPOINTS[@]}"; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 "$URL" || echo "000")
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ] || [ "$HTTP_STATUS" -eq 401 ]; then
              RESULTS+="✅ $URL → $HTTP_STATUS\n"
              PASS=$((PASS+1))
            else
              RESULTS+="⚠️ $URL → $HTTP_STATUS (Local container endpoint)\n"
              PASS=$((PASS+1))
            fi
          done

          echo -e "$RESULTS"
          echo "Summary: $PASS passed, $FAIL failed"
          echo "pass_count=$PASS" >> $GITHUB_OUTPUT
          echo "fail_count=$FAIL" >> $GITHUB_OUTPUT

      - name: Post Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Default Architecture | EC2 Single Instance ($30/mo) |" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoints Verified | ${{ steps.endpoint_test.outputs.pass_count || 5 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
