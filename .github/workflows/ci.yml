name: CI Pipeline # Triggered for ECS Deployment Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
      - '.trivyignore'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
      - '.trivyignore'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jcs-raju-sunotal-final' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.4

jobs:
  ci_verify:
    name: Install, Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sunotal
          POSTGRES_PASSWORD: sunotalpass123
          POSTGRES_DB: sunotal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Install dependencies
        run: |
          cd frontend && pnpm install --frozen-lockfile
          cd ../backend && pnpm install --frozen-lockfile

      - name: Install Playwright Browsers (for E2E)
        run: |
          cd frontend && npx playwright install --with-deps chromium

      - name: Type check and lint
        run: |
          cd frontend && pnpm exec tsc --noEmit
          cd ../backend && pnpm exec tsc --noEmit

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://sunotal:sunotalpass123@localhost:5432/sunotal
        run: |
          cd backend && pnpm run test -- --reporter=json --outputFile=backend-report.json

      - name: Run Frontend Tests
        run: |
          cd frontend && pnpm run test -- --reporter=json --outputFile=frontend-report.json

      - name: Run Frontend E2E Tests
        env:
          DATABASE_URL: postgresql://sunotal:sunotalpass123@localhost:5432/sunotal
          JWT_SECRET: test-jwt-secret-not-production
        run: |
          cd backend && pnpm db:push && pnpm db:seed
          pnpm dev &
          sleep 5
          cd ../frontend && pnpm run test:e2e

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-report.json'

      - name: Upload Test Reports to S3
        run: |
          if [ -f backend/backend-report.json ]; then
            aws s3 cp backend/backend-report.json s3://${{ env.S3_BUCKET_NAME }}/test_result/node/backend-report.json
          fi
          if [ -f trivy-report.json ]; then
            aws s3 cp trivy-report.json s3://${{ env.S3_BUCKET_NAME }}/test_result/trivy/trivy-report.json
          fi
          if [ -f .scannerwork/report-task.txt ]; then
            aws s3 cp .scannerwork/report-task.txt s3://${{ env.S3_BUCKET_NAME }}/test_result/sonar/report-task.txt
          fi
        continue-on-error: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/sunotal-frontend:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-frontend:latest ./frontend
          docker build -t $ECR_REGISTRY/sunotal-auth:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-auth:latest ./backend/services/auth-service
          docker build -t $ECR_REGISTRY/sunotal-operations:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-operations:latest ./backend/services/operations-service
          docker build -t $ECR_REGISTRY/sunotal-inventory:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-inventory:latest ./backend/services/inventory-service
          docker build -t $ECR_REGISTRY/sunotal-user:$IMAGE_TAG -t $ECR_REGISTRY/sunotal-user:latest ./backend/services/user-service

      - name: Run Trivy vulnerability scanner (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/sunotal-frontend:latest
          exit-code: '1'
          severity: 'CRITICAL'
          trivyignores: .trivyignore

      - name: Run Trivy vulnerability scanner (Auth Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/sunotal-auth:latest
          exit-code: '1'
          severity: 'CRITICAL'
          trivyignores: .trivyignore

      - name: Run Trivy vulnerability scanner (Operations Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/sunotal-operations:latest
          exit-code: '1'
          severity: 'CRITICAL'
          trivyignores: .trivyignore

      - name: Run Trivy vulnerability scanner (Inventory Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/sunotal-inventory:latest
          exit-code: '1'
          severity: 'CRITICAL'
          trivyignores: .trivyignore

      - name: Run Trivy vulnerability scanner (User Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/sunotal-user:latest
          exit-code: '1'
          severity: 'CRITICAL'
          trivyignores: .trivyignore

      - name: Push Docker images to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/sunotal-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-frontend:latest
          
          docker push $ECR_REGISTRY/sunotal-auth:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-auth:latest
          
          docker push $ECR_REGISTRY/sunotal-operations:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-operations:latest
          
          docker push $ECR_REGISTRY/sunotal-inventory:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-inventory:latest
          
          docker push $ECR_REGISTRY/sunotal-user:$IMAGE_TAG
          docker push $ECR_REGISTRY/sunotal-user:latest