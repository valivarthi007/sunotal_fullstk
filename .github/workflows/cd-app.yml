name: "CD: Application Rollout & Live Verification"

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'services/**'
      - 'docker-compose.yml'
      - 'nginx.conf'
      - '.github/workflows/cd-app.yml'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

jobs:
  deploy_to_ec2:
    name: EC2 SSM Container Rollout & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 Instance ID
        id: ec2_info
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=sunotal" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "⚠️ No running EC2 instance tagged Project=sunotal found."
            echo "instance_id=" >> $GITHUB_OUTPUT
          else
            echo "✅ Found target EC2 instance: $INSTANCE_ID"
            echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Remote Container Deployment via AWS SSM
        if: steps.ec2_info.outputs.instance_id != ''
        run: |
          INSTANCE_ID="${{ steps.ec2_info.outputs.instance_id }}"
          echo "🚀 Sending deployment script to instance $INSTANCE_ID..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/sunotal_fullstk || cd /app || exit 1", "git pull origin main", "docker compose up -d --build"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command sent. ID: $COMMAND_ID"

          # Wait for command execution
          echo "⏳ Polling SSM command execution..."
          for i in {1..30}; do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "  Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "✅ EC2 deployment succeeded!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ EC2 deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          done

      - name: Verify Live Endpoints & Subdomains
        run: |
          echo "🌐 Verifying live domain health & asset responses..."
          DOMAINS=(
            "https://sunotal.automateuniverse.space"
            "https://admin-sunotal.automateuniverse.space"
            "https://vendor-sunotal.automateuniverse.space"
            "https://delivery-sunotal.automateuniverse.space"
            "https://support-sunotal.automateuniverse.space"
            "https://monitoring-sunotal.automateuniverse.space"
          )

          for domain in "${DOMAINS[@]}"; do
            echo "🔍 Testing $domain..."
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "$domain" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "  ✅ $domain reachable (HTTP $STATUS)"
            else
              echo "  ⚠️ $domain returned HTTP $STATUS (may take a moment for DNS/SSL)"
            fi
          done
